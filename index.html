<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Evelin's Garden - Simulador de Vivero</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes flotar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .planta-animada { animation: flotar 3s ease-in-out infinite; }

        @keyframes flotarArriba {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
        .notificacion-flotante {
            animation: flotarArriba 1s ease-out forwards;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-teal-900 via-emerald-950 to-stone-950 text-amber-50 min-h-screen font-sans">

    <!-- Contenedor Principal -->
    <div class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- Cabecera Temática -->
        <header class="bg-emerald-900/90 border-4 border-emerald-600 rounded-3xl p-6 mb-8 shadow-2xl flex flex-col sm:flex-row justify-between items-center backdrop-blur-md gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-3xl sm:text-4xl font-black text-emerald-300 flex items-center justify-center sm:justify-start gap-3 drop-shadow">
                    🌸 Evelin's Garden 🌿
                </h1>
                <p class="text-emerald-200 text-sm mt-1 font-medium">¡Vivero realista con clima dinámico y tiempo real!</p>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Indicador de Clima Actual -->
                <div id="weather-banner" class="bg-emerald-950/80 px-4 py-3 rounded-2xl border-2 border-emerald-600 flex items-center gap-3 shadow-inner">
                    <span id="weather-icon" class="text-2xl">☀️</span>
                    <div>
                        <p class="text-[10px] text-emerald-400 uppercase font-black tracking-widest">Clima Actual</p>
                        <p id="weather-name" class="text-xs font-extrabold text-emerald-200">Soleado</p>
                    </div>
                </div>

                <!-- Monedas -->
                <div class="bg-emerald-950/80 px-5 py-3 rounded-2xl border-2 border-amber-400/60 flex items-center gap-3 shadow-inner">
                    <span class="text-2xl animate-bounce">🪙</span>
                    <div>
                        <p class="text-[10px] text-amber-300 uppercase font-black tracking-widest">Tus Monedas</p>
                        <p id="player-money" class="text-2xl font-black text-amber-400">150</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Tienda de Semillas -->
        <section class="bg-emerald-900/60 border-2 border-emerald-700/80 rounded-3xl p-6 mb-8 shadow-xl backdrop-blur-sm">
            <h2 class="text-xl font-bold text-emerald-200 mb-4 flex items-center gap-2">
                🛍️ Tienda de Semillas y Plantitas
            </h2>
            <div id="shop-container" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- Se llena dinámicamente -->
            </div>
        </section>

        <!-- El Jardín de Macetas -->
        <section class="bg-emerald-900/60 border-2 border-emerald-700/80 rounded-3xl p-6 shadow-xl backdrop-blur-sm">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-bold text-emerald-200 flex items-center gap-2">
                    🪴 Tu Colección de Macetas
                </h2>
                <button onclick="comprarMaceta()" class="bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-stone-950 font-black px-5 py-2.5 rounded-2xl text-sm transition shadow-lg transform hover:scale-105">
                    ✨ Ampliar Vivero (🪙 50)
                </button>
            </div>
            <div id="garden-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Se llena dinámicamente -->
            </div>
        </section>

    </div>

    <!-- Script del Juego con Sistema de Clima -->
    <script>
        const catalogosemillas = [
            { tipo: "Cactus", nombre: "Cactus Sonriente", icono: "🌵", costo: 30, valorVenta: 80, descripcion: "Resistente y aguanta sequías." },
            { tipo: "Monstera", nombre: "Monstera Elegante", icono: "🌿", costo: 60, valorVenta: 150, descripcion: "Hojas grandes y exóticas." },
            { tipo: "Orquidea", nombre: "Orquídea Mágica", icono: "🌸", costo: 100, valorVenta: 280, descripcion: "Delicada pero muy valiosa." }
        ];

        const tiposClima = [
            { id: "soleado", nombre: "Soleado", icono: "☀️", efectoHumedad: 3, descripcion: "Seca la tierra más rápido." },
            { id: "nublado", nombre: "Nublado", icono: "☁️", efectoHumedad: 1, descripcion: "Condiciones estables." },
            { id: "lluvioso", nombre: "Lluvioso", icono: "🌧️", efectoHumedad: -3, descripcion: "¡Riega las plantas automáticamente!" }
        ];

        let gameState = {
            money: 150,
            lastUpdate: Date.now(),
            climaActual: "soleado",
            ultimoCambioClima: Date.now(),
            plants: [
                { id: 1, tipo: "Cactus", etapa: "Brote 🌱", salud: 100, humedad: 80, nutrientes: 80, progreso: 10 },
                { id: 2, tipo: null, salud: 0, humedad: 0, nutrientes: 0, progreso: 0 }
            ]
        };

        function cargarJuego() {
            const saved = localStorage.getItem('evelins_garden_save');
            if (saved) {
                gameState = JSON.parse(saved);
                verificarClima();
                calcularProgresoAusente();
            }
        }

        function guardarJuego() {
            gameState.lastUpdate = Date.now();
            localStorage.setItem('evelins_garden_save', JSON.stringify(gameState));
        }

        // Sistema de cambio aleatorio de clima
        function verificarClima() {
            const ahora = Date.now();
            // Cambia de clima cada 2 minutos (120,000 ms) o si no está definido
            if (!gameState.ultimoCambioClima || (ahora - gameState.ultimoCambioClima > 120000)) {
                const climaAleatorio = tiposClima[Math.floor(Math.random() * tiposClima.length)];
                gameState.climaActual = climaAleatorio.id;
                gameState.ultimoCambioClima = ahora;
                guardarJuego();
            }
            actualizarBannerClima();
        }

        function actualizarBannerClima() {
            const climaInfo = tiposClima.find(c => c.id === gameState.climaActual) || tiposClima[0];
            document.getElementById('weather-icon').innerText = climaInfo.icono;
            document.getElementById('weather-name').innerText = `${climaInfo.nombre} (${climaInfo.descripcion})`;
        }

        function calcularProgresoAusente() {
            const ahora = Date.now();
            const segundosPasados = Math.floor((ahora - gameState.lastUpdate) / 1000);
            
            if (segundosPasados <= 5) return;

            const ciclos = Math.floor(segundosPasados / 3);
            const climaInfo = tiposClima.find(c => c.id === gameState.climaActual) || tiposClima[0];

            gameState.plants.forEach(p => {
                if (p.tipo !== null && p.progreso < 100 && p.salud > 0) {
                    // El clima afecta directamente la humedad (si llueve, sube; si hay sol, baja rápido)
                    p.humedad = Math.min(100, Math.max(0, p.humedad - (ciclos * climaInfo.efectoHumedad)));
                    p.nutrientes = Math.max(0, p.nutrientes - (ciclos * 1));

                    if (p.humedad <= 10 || p.nutrientes <= 5) {
                        p.salud = Math.max(0, p.salud - (ciclos * 3));
                    }

                    if (p.salud > 20 && p.humedad > 10) {
                        p.progreso = Math.min(100, p.progreso + (ciclos * 1.5));
                        if (p.progreso >= 50 && p.etapa.includes("Brote")) p.etapa = "Creciendo 🌿";
                        if (p.progreso >= 100) p.etapa = "Madura ✨";
                    } else if (p.salud <= 0) {
                        p.etapa = "Marchita 🥀";
                    }
                }
            });
            guardarJuego();
        }

        function mostrarEfectoFlotante(index, texto, colorClase) {
            const tarjeta = document.getElementById(`maceta-${index}`);
            if (!tarjeta) return;

            const flotante = document.createElement('div');
            flotante.className = `notificacion-flotante absolute top-4 right-6 font-black text-sm px-3 py-1 rounded-full shadow-lg z-20 ${colorClase}`;
            flotante.innerText = texto;
            
            tarjeta.appendChild(flotante);
            setTimeout(() => flotante.remove(), 1000);
        }

        function renderizarTienda() {
            const container = document.getElementById('shop-container');
            container.innerHTML = '';
            
            catalogosemillas.forEach(semilla => {
                container.innerHTML += `
                    <div class="bg-emerald-950/80 p-5 rounded-2xl border-2 border-emerald-800 flex flex-col justify-between hover:border-emerald-500 transition group">
                        <div class="flex items-center gap-4">
                            <span class="text-4xl p-3 bg-emerald-900/50 rounded-2xl group-hover:scale-110 transition">${semilla.icono}</span>
                            <div>
                                <h3 class="font-bold text-base text-emerald-100">${semilla.nombre}</h3>
                                <p class="text-xs text-emerald-400 mt-0.5">${semilla.descripcion}</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center mt-5 pt-3 border-t border-emerald-900/80">
                            <span class="text-amber-400 font-black text-lg">🪙 ${semilla.costo}</span>
                            <button onclick="plantarSemilla('${semilla.tipo}')" class="bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-black px-4 py-2 rounded-xl text-xs transition shadow">
                                Plantar 🪴
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function renderizarJardin() {
            document.getElementById('player-money').innerText = gameState.money;
            const container = document.getElementById('garden-container');
            container.innerHTML = '';

            gameState.plants.forEach((plant, index) => {
                if (!plant.tipo) {
                    container.innerHTML += `
                        <div class="bg-emerald-950/40 border-3 border-dashed border-emerald-700/60 rounded-3xl p-6 flex flex-col items-center justify-center text-center h-56 hover:bg-emerald-950/60 transition">
                            <span class="text-4xl mb-2 opacity-50">🕳️</span>
                            <p class="text-emerald-300 font-bold mb-1">Maceta Vacía</p>
                            <p class="text-xs text-emerald-400/80">Elige una semilla arriba para comenzar a cultivar.</p>
                        </div>
                    `;
                } else {
                    const semillaInfo = catalogosemillas.find(s => s.tipo === plant.tipo);
                    let esMadura = plant.progreso >= 100;
                    let estaMuerta = plant.salud <= 0;
                    
                    let iconoActual = semillaInfo.icono;
                    if (estaMuerta) iconoActual = "🥀";
                    else if (plant.progreso < 50) iconoActual = "🌱";
                    else if (plant.progreso < 100) iconoActual = "🌿";

                    container.innerHTML += `
                        <div id="maceta-${index}" class="bg-emerald-950/90 border-2 ${estaMuerta ? 'border-rose-600' : 'border-emerald-700'} rounded-3xl p-5 flex flex-col justify-between shadow-xl relative overflow-hidden">
                            <div class="flex items-center gap-4">
                                <div class="w-16 h-16 bg-emerald-900/80 rounded-2xl flex items-center justify-center text-4xl shadow-inner ${estaMuerta ? '' : 'planta-animada'} border border-emerald-600">
                                    ${iconoActual}
                                </div>
                                <div class="flex-1">
                                    <h3 class="font-black text-lg text-emerald-100">${semillaInfo.nombre}</h3>
                                    <span class="inline-block text-[11px] px-3 py-1 rounded-full font-extrabold mt-1 ${estaMuerta ? 'bg-rose-600 text-white' : (esMadura ? 'bg-amber-400 text-stone-950 shadow-md animate-pulse' : 'bg-emerald-800 text-emerald-200')}">
                                        ${estaMuerta ? '❌ ¡Se marchitó!' : (esMadura ? '✨ ¡Lista para cosechar!' : plant.etapa)}
                                    </span>
                                </div>
                            </div>

                            <div class="mt-4 space-y-2 bg-emerald-950/50 p-3 rounded-2xl border border-emerald-900">
                                <div>
                                    <div class="flex justify-between text-xs text-emerald-300 font-bold mb-1"><span>❤️ Salud</span><span>${Math.round(plant.salud)}%</span></div>
                                    <div class="w-full bg-emerald-900 rounded-full h-2 overflow-hidden"><div class="bg-rose-500 h-2 transition-all duration-500 rounded-full" style="width: ${plant.salud}%"></div></div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs text-emerald-300 font-bold mb-1"><span>💧 Humedad</span><span>${Math.round(plant.humedad)}%</span></div>
                                    <div class="w-full bg-emerald-900 rounded-full h-2 overflow-hidden"><div class="bg-blue-400 h-2 transition-all duration-500 rounded-full" style="width: ${plant.humedad}%"></div></div>
                                </div>
                                <div>
                                    <div class="flex justify-between text-xs text-emerald-300 font-bold mb-1"><span>🌱 Crecimiento</span><span>${Math.round(plant.progreso)}%</span></div>
                                    <div class="w-full bg-emerald-900 rounded-full h-2 overflow-hidden"><div class="bg-emerald-400 h-2 transition-all duration-500 rounded-full" style="width: ${plant.progreso}%"></div></div>
                                </div>
                            </div>

                            <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-emerald-900">
                                ${estaMuerta 
                                    ? `<button onclick="limpiarMaceta(${index})" class="col-span-3 bg-rose-700 hover:bg-rose-600 text-white font-black text-xs py-2 rounded-xl transition shadow">🧹 Limpiar Maceta</button>`
                                    : `
                                        <button onclick="regar(${index})" class="bg-blue-600 hover:bg-blue-500 text-white font-black text-xs py-2 rounded-xl transition shadow flex items-center justify-center gap-1">💧 Regar</button>
                                        <button onclick="alimentar(${index})" class="bg-amber-700 hover:bg-amber-600 text-white font-black text-xs py-2 rounded-xl transition shadow flex items-center justify-center gap-1">🍂 Abonar</button>
                                        ${esMadura 
                                            ? `<button onclick="cosechar(${index})" class="bg-emerald-400 hover:bg-emerald-300 text-stone-950 font-black text-xs py-2 rounded-xl transition shadow flex items-center justify-center gap-1">💰 Vender</button>`
                                            : `<button onclick="podar(${index})" class="bg-purple-700 hover:bg-purple-600 text-white font-black text-xs py-2 rounded-xl transition shadow flex items-center justify-center gap-1">✂️ Podar</button>`
                                        }
                                    `
                                }
                            </div>
                        </div>
                    `;
                }
            });
        }

        function plantarSemilla(tipo) {
            const semillaInfo = catalogosemillas.find(s => s.tipo === tipo);
            if (gameState.money < semillaInfo.costo) {
                alert("¡Ups! No tienes suficientes monedas para esta semilla.");
                return;
            }

            const macetaVacia = gameState.plants.find(p => p.tipo === null);
            if (!macetaVacia) {
                alert("¡No hay macetas vacías! Compra otra maceta para seguir plantando.");
                return;
            }

            gameState.money -= semillaInfo.costo;
            macetaVacia.tipo = tipo;
            macetaVacia.etapa = "Brote 🌱";
            macetaVacia.salud = 100;
            macetaVacia.humedad = 90;
            macetaVacia.nutrientes = 90;
            macetaVacia.progreso = 0;

            guardarJuego();
            actualizarUI();
        }

        function regar(index) {
            gameState.plants[index].humedad = 100;
            if (gameState.plants[index].salud < 100) gameState.plants[index].salud = Math.min(100, gameState.plants[index].salud + 15);
            guardarJuego();
            actualizarUI();
            mostrarEfectoFlotante(index, "+💧 ¡Agua!", "bg-blue-500 text-white");
        }

        function alimentar(index) {
            gameState.plants[index].nutrientes = 100;
            guardarJuego();
            actualizarUI();
            mostrarEfectoFlotante(index, "+🍂 ¡Abono!", "bg-amber-600 text-white");
        }

        function podar(index) {
            let p = gameState.plants[index];
            p.progreso = Math.min(100, p.progreso + 20);
            if (p.progreso >= 50 && p.etapa.includes("Brote")) p.etapa = "Creciendo 🌿";
            if (p.progreso >= 100) p.etapa = "Madura ✨";
            guardarJuego();
            actualizarUI();
            mostrarEfectoFlotante(index, "✂️ ¡Podada!", "bg-purple-600 text-white");
        }

        function cosechar(index) {
            let p = gameState.plants[index];
            const semillaInfo = catalogosemillas.find(s => s.tipo === p.tipo);
            gameState.money += semillaInfo.valorVenta;

            mostrarEfectoFlotante(index, `+🪙 ${semillaInfo.valorVenta}`, "bg-amber-400 text-stone-950 font-black");

            gameState.plants[index] = { id: p.id, tipo: null, salud: 0, humedad: 0, nutrientes: 0, progreso: 0 };
            guardarJuego();
            setTimeout(() => actualizarUI(), 400);
        }

        function limpiarMaceta(index) {
            let p = gameState.plants[index];
            gameState.plants[index] = { id: p.id, tipo: null, salud: 0, humedad: 0, nutrientes: 0, progreso: 0 };
            guardarJuego();
            actualizarUI();
        }

        function comprarMaceta() {
            let costoMaceta = 50;
            if (gameState.money < costoMaceta) {
                alert("¡Te faltan monedas para comprar otra maceta!");
                return;
            }
            gameState.money -= costoMaceta;
            gameState.plants.push({ id: gameState.plants.length + 1, tipo: null, salud: 0, humedad: 0, nutrientes: 0, progreso: 0 });
            guardarJuego();
            actualizarUI();
        }

        // Bucle en tiempo real
        setInterval(() => {
            verificarClima();
            const climaInfo = tiposClima.find(c => c.id === gameState.climaActual) || tiposClima[0];
            
            let cambio = false;
            gameState.plants.forEach(p => {
                if (p.tipo !== null && p.progreso < 100 && p.salud > 0) {
                    // La humedad sube o baja dependiendo del clima actual
                    p.humedad = Math.min(100, Math.max(0, p.humedad - climaInfo.efectoHumedad));
                    p.nutrientes = Math.max(0, p.nutrientes - 1);

                    if (p.humedad <= 10 || p.nutrientes <= 5) {
                        p.salud = Math.max(0, p.salud - 3);
                    }

                    if (p.salud > 20 && p.humedad > 10) {
                        p.progreso = Math.min(100, p.progreso + 1.5);
                        if (p.progreso >= 50 && p.etapa.includes("Brote")) p.etapa = "Creciendo 🌿";
                        if (p.progreso >= 100) p.etapa = "Madura ✨";
                    } else if (p.salud <= 0) {
                        p.etapa = "Marchita 🥀";
                    }
                    cambio = true;
                }
            });
            if (cambio) {
                guardarJuego();
                actualizarUI();
            }
        }, 3000);

        function actualizarUI() {
            renderizarTienda();
            renderizarJardin();
        }

        cargarJuego();
        actualizarUI();
    </script>
</body>
</html>
