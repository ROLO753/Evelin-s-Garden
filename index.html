<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 Evelin's Garden - Granja Emocionante</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .planta-viva {
            animation: latido 2s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes saltarMoneda {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-80px) scale(1.4); opacity: 0; }
        }
        .moneda-volando {
            animation: saltarMoneda 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes temblor {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-4px, 2px); }
            40% { transform: translate(4px, -2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0, 0); }
        }
        .alerta-plaga {
            animation: temblor 0.4s ease-in-out infinite;
        }

        .parcela-tierra {
            background-color: #78350f;
            background-image: radial-gradient(#92400e 15%, transparent 16%),
                              radial-gradient(#451a03 15%, transparent 16%);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            box-shadow: inset 0 8px 14px rgba(0,0,0,0.6), 0 6px 0 #451a03;
        }

        .parcela-humeda {
            background-color: #451a03;
            background-image: radial-gradient(#78350f 15%, transparent 16%),
                              radial-gradient(#290f02 15%, transparent 16%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden select-none font-sans bg-sky-300 text-lg">

    <!-- CABECERA DE ACCIÓN -->
    <div class="relative bg-gradient-to-b from-sky-400 via-sky-300 to-emerald-200 pt-5 pb-8 px-4 border-b-8 border-amber-900">
        
        <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 bg-amber-50 border-4 border-amber-800 rounded-3xl px-6 py-4 shadow-xl mb-6">
            <div class="flex items-center gap-4 text-center md:text-left">
                <span class="text-5xl">🌻</span>
                <div>
                    <h1 class="text-3xl sm:text-4xl font-black text-amber-950 tracking-tight">
                        EVELIN'S GARDEN: GRANJA ACTIVA
                    </h1>
                    <p class="text-base sm:text-lg font-bold text-emerald-800">¡Cuidado con las plagas y atiende los pedidos rápido!</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="bg-amber-200 border-3 border-amber-600 px-5 py-2.5 rounded-2xl flex items-center gap-3 shadow-inner">
                    <span class="text-4xl">🪙</span>
                    <div>
                        <p class="text-xs font-black uppercase text-amber-900">MONEDAS</p>
                        <p id="player-money" class="text-3xl font-black text-amber-950">250</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- CARTEL DE ACCIÓN Y RETOS -->
        <div id="visual-banner" class="max-w-6xl mx-auto mb-5 bg-amber-100 border-4 border-amber-600 rounded-2xl px-6 py-4 text-center shadow-lg transition-all">
            <p id="visual-banner-text" class="text-xl sm:text-2xl font-black text-amber-950">
                🚀 ¡Juego Activo! Riega rápido, espanta plagas y completa los encargos de la aldea.
            </p>
        </div>

        <!-- TABLÓN DE PEDIDOS RÁPIDOS -->
        <section class="max-w-6xl mx-auto bg-amber-900 border-4 border-amber-950 rounded-3xl p-5 shadow-2xl">
            <h2 class="text-amber-100 font-black text-xl uppercase mb-4 flex items-center gap-2">
                📜 Pedidos Urgentes (¡Pagan el doble al instante!)
            </h2>
            <div id="orders-container" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>
    </div>

    <!-- HUERTO INTERACTIVO -->
    <main class="flex-1 py-8 px-4 relative" style="background: linear-gradient(180deg, #4ade80 0%, #22c55e 40%, #15803d 100%);">
        
        <div class="max-w-6xl mx-auto mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-amber-950 border-4 border-amber-600 px-6 py-4 rounded-2xl shadow-xl text-white">
            <div class="text-lg sm:text-2xl font-black flex items-center gap-3 flex-wrap justify-center">
                <span>HERRAMIENTA EN MANO:</span>
                <span id="active-tool-label" class="bg-amber-400 text-amber-950 px-4 py-1 rounded-xl text-xl sm:text-2xl font-black">💧 REGADERA</span>
            </div>
            <button onclick="comprarParcela()" class="bg-emerald-400 hover:bg-emerald-300 text-emerald-950 font-black text-base sm:text-lg px-5 py-3 rounded-2xl border-3 border-emerald-800 shadow-lg cursor-pointer">
                ➕ NUEVA PARCELA (🪙 80)
            </button>
        </div>

        <div id="farm-grid" class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-64"></div>
    </main>

    <!-- BARRA INFERIOR DE ACCIÓN RÁPIDA -->
    <footer class="fixed bottom-0 left-0 right-0 z-30 bg-amber-950 border-t-4 border-amber-500 px-3 py-3 shadow-2xl">
        <div class="max-w-6xl mx-auto flex flex-col gap-3">
            
            <div class="flex items-center gap-2 sm:gap-3 overflow-x-auto justify-start sm:justify-center pb-1">
                <button onclick="seleccionarHerramienta('regar', '💧 REGADERA')" id="btn-regar" class="tool-btn ring-4 ring-amber-300 bg-blue-600 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer shadow-lg transform active:scale-95">
                    <span class="text-3xl">💧</span>
                    <span class="text-base sm:text-lg font-black uppercase">Regar</span>
                </button>

                <button onclick="seleccionarHerramienta('abonar', '🍂 ABONO MÁGICO')" id="btn-abonar" class="tool-btn bg-amber-700 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer shadow-lg transform active:scale-95">
                    <span class="text-3xl">🍂</span>
                    <span class="text-base sm:text-lg font-black uppercase">Abonar (+25%)</span>
                </button>

                <button onclick="seleccionarHerramienta('plaga', '🐛 ESPANTAR PLAGA')" id="btn-plaga" class="tool-btn bg-rose-600 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer shadow-lg transform active:scale-95">
                    <span class="text-3xl">🐛</span>
                    <span class="text-base sm:text-lg font-black uppercase">Quitar Gusano</span>
                </button>

                <button onclick="seleccionarHerramienta('cosechar', '🧺 RECOGER FLORES')" id="btn-cosechar" class="tool-btn bg-emerald-600 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer shadow-lg transform active:scale-95">
                    <span class="text-3xl">🧺</span>
                    <span class="text-base sm:text-lg font-black uppercase">Cosechar</span>
                </button>

                <button onclick="seleccionarHerramienta('arrancar', '🪓 PALA')" id="btn-arrancar" class="tool-btn bg-stone-700 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer shadow-lg transform active:scale-95">
                    <span class="text-3xl">🪓</span>
                    <span class="text-base sm:text-lg font-black uppercase">Limpiar</span>
                </button>
            </div>

            <!-- Semillas -->
            <div id="seeds-toolbar" class="flex items-center gap-2 sm:gap-3 overflow-x-auto justify-start sm:justify-center pb-1"></div>

        </div>
    </footer>

    <script>
        const catalogoPlantas = [
            { tipo: "Margarita", nombre: "Margarita", icono: "🌼", costo: 15, venta: 50, desc: "Crece rápido y alegra el jardín." },
            { tipo: "Girasol", nombre: "Girasol", icono: "🌻", costo: 35, venta: 110, desc: "Da excelentes ganancias." },
            { tipo: "Manzanilla", nombre: "Manzanilla", icono: "🌼", costo: 25, venta: 80, desc: "Ideal para té relajante." },
            { tipo: "Menta", nombre: "Menta", icono: "🌿", costo: 30, venta: 90, desc: "Hierba fresca para infusiones." },
            { tipo: "Lavanda", nombre: "Lavanda", icono: "🪻", costo: 60, venta: 180, desc: "Aromática y muy cotizada." }
        ];

        let herramientaActual = "regar";

        let gameState = {
            money: 200,
            inventario: { Margarita: 0, Girasol: 0, Manzanilla: 0, Menta: 0, Lavanda: 0 },
            pedidos: [
                { id: 1, cliente: "👴 Don Mateo", tipo: "Margarita", cantidad: 2, recompensa: 140 },
                { id: 2, cliente: "👩‍🌾 Doña Rosa", tipo: "Manzanilla", cantidad: 2, recompensa: 200 }
            ],
            parcelas: [
                { id: 1, tipo: "Margarita", agua: 80, progreso: 20, plaga: false },
                { id: 2, tipo: "Girasol", agua: 50, progreso: 80, plaga: true }, // Empieza con plaga para que lo resuelva
                { id: 3, tipo: null, agua: 0, progreso: 0, plaga: false }
            ]
        };

        function avisar(msg, tipo = "info") {
            const banner = document.getElementById('visual-banner');
            const texto = document.getElementById('visual-banner-text');
            texto.innerText = msg;
            if(tipo === "exito") banner.className = "max-w-6xl mx-auto mb-5 bg-emerald-100 border-4 border-emerald-600 rounded-2xl px-6 py-4 text-center shadow-lg transition-all";
            else if(tipo === "alerta") banner.className = "max-w-6xl mx-auto mb-5 bg-rose-100 border-4 border-rose-600 rounded-2xl px-6 py-4 text-center shadow-lg transition-all";
            else banner.className = "max-w-6xl mx-auto mb-5 bg-amber-100 border-4 border-amber-600 rounded-2xl px-6 py-4 text-center shadow-lg transition-all";
        }

        function seleccionarHerramienta(codigo, etiqueta) {
            herramientaActual = codigo;
            document.getElementById('active-tool-label').innerText = etiqueta;
            avisar(`Herramienta activa: ${etiqueta}. ¡Toca una parcela de tierra!`);
            
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('ring-4', 'ring-amber-300', 'scale-105'));
            const activo = document.getElementById(`btn-${codigo.replace(':', '-')}`);
            if (activo) activo.classList.add('ring-4', 'ring-amber-300', 'scale-105');
        }

        // Animación de monedas flotantes al ganar dinero
        function animarMonedas(index) {
            const parcela = document.getElementById(`parcela-${index}`);
            if(!parcela) return;
            const moneda = document.createElement('div');
            moneda.className = "absolute text-3xl font-black text-amber-300 moneda-volando z-30 top-1/2 left-1/2";
            moneda.innerText = "🪙 +💰";
            parcela.appendChild(moneda);
            setTimeout(() => moneda.remove(), 1000);
        }

        function interactuarParcela(index) {
            const p = gameState.parcelas[index];

            // Sembrar
            if (herramientaActual.startsWith('semilla:')) {
                const tipoSemilla = herramientaActual.split(':')[1];
                const info = catalogoPlantas.find(c => c.tipo === tipoSemilla);

                if (p.tipo !== null) {
                    avisar("⚠️ Esa tierra está ocupada. Limpia o cosecha primero.", "alerta");
                    return;
                }
                if (gameState.money < info.costo) {
                    avisar("⚠️ No tienes suficientes monedas para comprar esta semilla.", "alerta");
                    return;
                }

                gameState.money -= info.costo;
                gameState.parcelas[index] = { id: p.id, tipo: info.tipo, agua: 100, progreso: 0, plaga: false };
                renderizarTodo();
                avisar(`🌱 ¡Sembraste ${info.nombre}! ¡Atento a que crezca!`, "exito");
                return;
            }

            if (p.tipo === null) {
                avisar("👇 Elige una semilla abajo para plantar en esta tierra vacía.", "info");
                return;
            }

            // Quitar plaga con herramienta de gusano
            if (herramientaActual === 'plaga') {
                if (p.plaga) {
                    p.plaga = false;
                    p.progreso = Math.min(100, p.progreso + 15); // ¡Recompensa por limpiar rápido!
                    renderizarTodo();
                    avisar("🐛 ¡Eliminaste la plaga con éxito! La planta recuperó fuerza.", "exito");
                } else {
                    avisar("✨ Esta planta está limpia, no tiene plagas.", "info");
                }
                return;
            }

            if (herramientaActual === 'arrancar') {
                gameState.parcelas[index] = { id: p.id, tipo: null, agua: 0, progreso: 0, plaga: false };
                renderizarTodo();
                avisar("🪓 Tierra despejada y lista para usar.", "info");
                return;
            }

            if (p.plaga) {
                avisar("🐛 ¡Cuidado! Esta planta tiene un gusano y no crecerá hasta que uses el botón 'Quitar Gusano'.", "alerta");
                return;
            }

            // Regar
            if (herramientaActual === 'regar') {
                p.agua = 100;
                p.progreso = Math.min(100, p.progreso + 25); // ¡Regar da un impulso inmediato de crecimiento!
                renderizarTodo();
                avisar("💧 ¡Riego exitoso! La planta creció un 25% al instante.", "exito");
            }
            // Abonar
            else if (herramientaActual === 'abonar') {
                p.progreso = Math.min(100, p.progreso + 40); // ¡Abono da un gran salto!
                renderizarTodo();
                avisar("🍂 ¡Abono mágico aplicado! Gran salto en el crecimiento.", "exito");
            }
            // Cosechar
            else if (herramientaActual === 'cosechar') {
                if (p.progreso < 100) {
                    avisar("⏳ Aún le falta crecer para poder cosecharla.", "info");
                    return;
                }
                const info = catalogoPlantas.find(c => c.tipo === p.tipo);
                gameState.inventario[p.tipo] = (gameState.inventario[p.tipo] || 0) + 1;
                
                animarMonedas(index);
                gameState.parcelas[index] = { id: p.id, tipo: null, agua: 0, progreso: 0, plaga: false };
                renderizarTodo();
                avisar(`🧺 ¡Cosechaste ${info.nombre} con éxito! Guárdala para los pedidos.`, "exito");
            }
        }

        function entregarPedido(idx) {
            const pedido = gameState.pedidos[idx];
            const tienes = gameState.inventario[pedido.tipo] || 0;

            if (tienes < pedido.cantidad) {
                avisar(`⚠️ Te faltan unidades. Tienes ${tienes} y te piden ${pedido.cantidad}.`, "alerta");
                return;
            }

            gameState.inventario[pedido.tipo] -= pedido.cantidad;
            gameState.money += pedido.recompensa;

            // Nuevo pedido sorpresa instantáneo
            const randomPlanta = catalogoPlantas[Math.floor(Math.random() * catalogoPlantas.length)];
            const vecinos = ["👴 Don Mateo", "👩 Doña Rosa", "👧 Sofía", "🧑‍🦰 Lucas"];
            gameState.pedidos[idx] = {
                id: Date.now(),
                cliente: vecinos[Math.floor(Math.random() * vecinos.length)],
                tipo: randomPlanta.tipo,
                cantidad: 1,
                recompensa: randomPlanta.venta * 2 // ¡Pagan el doble!
            };

            renderizarTodo();
            avisar(`🎉 ¡Pedido entregado con éxito! ¡Ganaste 🪙 ${pedido.recompensa} monedas!`, "exito");
        }

        function comprarParcela() {
            const costo = 80;
            if (gameState.money < costo) {
                avisar("⚠️ Te faltan monedas para comprar más terreno.", "alerta");
                return;
            }
            gameState.money -= costo;
            gameState.parcelas.push({ id: gameState.parcelas.length + 1, tipo: null, agua: 0, progreso: 0, plaga: false });
            renderizarTodo();
            avisar("✨ ¡Terreno ampliado con éxito! Tienes más espacio para sembrar.", "exito");
        }

        function renderizarPedidos() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            gameState.pedidos.forEach((ped, idx) => {
                const info = catalogoPlantas.find(c => c.tipo === ped.tipo);
                const tienes = gameState.inventario[ped.tipo] || 0;
                const listo = tienes >= ped.cantidad;

                container.innerHTML += `
                    <div class="bg-amber-50 border-4 ${listo ? 'border-emerald-600' : 'border-amber-700'} rounded-2xl p-4 flex flex-col justify-between gap-3 shadow-md">
                        <div>
                            <p class="text-base font-black text-amber-900">${ped.cliente}</p>
                            <p class="text-xl font-black text-stone-900 mt-1">Pide: ${ped.cantidad} ${info.icono} ${info.nombre}</p>
                            <p class="text-base font-extrabold text-emerald-800 mt-1">Tienes en inventario: ${tienes}</p>
                        </div>
                        <button onclick="entregarPedido(${idx})" class="w-full ${listo ? 'bg-emerald-500 hover:bg-emerald-400 text-emerald-950 cursor-pointer animate-pulse' : 'bg-stone-300 text-stone-600'} font-black text-lg py-2.5 rounded-xl border-2 border-stone-800 transition">
                            ${listo ? `✅ ENTREGAR YA (+🪙 ${ped.recompensa})` : `Faltan flores`}
                        </button>
                    </div>
                `;
            });
        }

        function renderizarSemillas() {
            const container = document.getElementById('seeds-toolbar');
            container.innerHTML = '';
            catalogoPlantas.forEach(planta => {
                const btnId = `btn-semilla-${planta.tipo}`;
                const esActiva = herramientaActual === `semilla:${planta.tipo}`;
                const tienes = gameState.inventario[planta.tipo] || 0;

                container.innerHTML += `
                    <button onclick="seleccionarHerramienta('semilla:${planta.tipo}', '${planta.icono} ${planta.nombre.toUpperCase()}')" 
                            id="${btnId}" 
                            class="tool-btn ${esActiva ? 'ring-4 ring-amber-300 scale-105' : ''} bg-emerald-800 border-2 border-emerald-400 text-white px-4 py-2.5 rounded-2xl flex items-center gap-3 shrink-0 cursor-pointer shadow">
                        <span class="text-3xl">${planta.icono}</span>
                        <div class="text-left">
                            <p class="text-base font-black leading-tight">${planta.nombre}</p>
                            <p class="text-xs font-bold text-amber-200">${planta.desc}</p>
                            <p class="text-sm font-black text-amber-300 mt-0.5">🪙 ${planta.costo} | Tienes: ${tienes}</p>
                        </div>
                    </button>
                `;
            });
        }

        function renderizarHuerto() {
            document.getElementById('player-money').innerText = gameState.money;
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';

            gameState.parcelas.forEach((p, index) => {
                const estaHumeda = p.agua > 40;
                const claseTierra = estaHumeda ? 'parcela-tierra parcela-humeda' : 'parcela-tierra';
                const tienePlaga = p.plaga;

                if (!p.tipo) {
                    grid.innerHTML += `
                        <div id="parcela-${index}" onclick="interactuarParcela(${index})" 
                             class="${claseTierra} rounded-3xl h-64 border-4 border-amber-950 flex flex-col items-center justify-center cursor-pointer p-4 text-center relative shadow-xl">
                            <span class="text-5xl opacity-50 mb-2">🕳️</span>
                            <span class="text-xl font-black text-amber-100 bg-black/50 px-4 py-1.5 rounded-xl">Tierra Vacía (Toca para Sembrar)</span>
                        </div>
                    `;
                } else {
                    const info = catalogoPlantas.find(c => c.tipo === p.tipo);
                    const madura = p.progreso >= 100;

                    let visualPlanta = info.brote;
                    let tamanoVisual = "text-6xl";

                    if (tienePlaga) {
                        visualPlanta = "🐛🥀";
                        tamanoVisual = "text-6xl alerta-plaga";
                    } else if (madura) {
                        visualPlanta = info.icono;
                        tamanoVisual = "text-8xl drop-shadow-xl";
                    } else if (p.progreso >= 50) {
                        visualPlanta = info.media;
                        tamanoVisual = "text-7xl";
                    }

                    let estadoTexto = "";
                    if (tienePlaga) {
                        estadoTexto = `<span class="bg-rose-600 text-white text-base font-black px-3 py-1 rounded-xl border-2 border-white animate-bounce">🐛 ¡TIENE GUSANO!</span>`;
                    } else if (madura) {
                        estadoTexto = `<span class="bg-amber-400 text-amber-950 text-base font-black px-3 py-1 rounded-xl border-2 border-amber-950 animate-bounce">🧺 ¡LISTA PARA COSECHAR!</span>`;
                    } else {
                        estadoTexto = `<span class="bg-emerald-700 text-white text-sm font-black px-3 py-1 rounded-xl">¡Toca para avanzar!</span>`;
                    }

                    grid.innerHTML += `
                        <div id="parcela-${index}" onclick="interactuarParcela(${index})" 
                             class="${claseTierra} rounded-3xl h-64 border-4 ${madura ? 'border-amber-300' : 'border-amber-950'} flex flex-col items-center justify-between p-4 cursor-pointer relative shadow-xl">
                            
                            <div class="w-full flex justify-between items-center">
                                <span class="text-lg font-black text-white bg-black/60 px-3 py-0.5 rounded-xl">${info.nombre}</span>
                                ${estadoTexto}
                            </div>

                            <div class="flex-1 flex items-center justify-center my-1">
                                <span class="${tamanoVisual} ${tienePlaga ? '' : 'planta-viva'} select-none">
                                    ${visualPlanta}
                                </span>
                            </div>

                            <div class="w-full bg-black/75 rounded-2xl p-2.5 space-y-2">
                                <div class="flex justify-between text-base font-black text-white px-1">
                                    <span>🌱 Crecimiento:</span>
                                    <span class="text-emerald-300">${Math.round(p.progreso)}%</span>
                                </div>
                                <div class="w-full bg-stone-700 h-3 rounded-full overflow-hidden">
                                    <div class="bg-emerald-400 h-3 transition-all duration-300" style="width: ${p.progreso}%"></div>
                                </div>
                            </div>

                        </div>
                    `;
                }
            });
        }

        function renderizarTodo() {
            renderizarPedidos();
            renderizarSemillas();
            renderizarHuerto();
        }

        // Evento sorpresa aleatorio: Cada 20 segundos puede aparecer una plaga sorpresa en una planta
        setInterval(() => {
            const parcelasConPlanta = gameState.parcelas.filter(p => p.tipo !== null && !p.plaga && p.progreso < 100);
            if (parcelasConPlanta.length > 0 && Math.random() > 0.4) {
                const aleatoria = parcelasConPlanta[Math.floor(Math.random() * parcelasConPlanta.length)];
                aleatoria.plaga = true;
                renderizarHuerto();
                avisar("⚠️ ¡Alerta! ¡Un gusano atacó una de tus plantas! Usa el botón rojo 'Quitar Gusano'.", "alerta");
            }
        }, 20000);

        renderizarTodo();
    </script>
</body>
</html>
