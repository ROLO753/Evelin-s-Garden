<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 Evelin's Garden - Simulador de Granja y Flores</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Animaciones estilo videojuego casual */
        @keyframes balanceo {
            0%, 100% { transform: rotate(-3deg) scale(1); }
            50% { transform: rotate(3deg) scale(1.05); }
        }
        .planta-viva {
            animation: balanceo 3s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes nubes {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }
        .nube-animada {
            animation: nubes 45s linear infinite;
        }

        @keyframes flotarArriba {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.3); }
        }
        .efecto-flotante {
            animation: flotarArriba 1s ease-out forwards;
            pointer-events: none;
        }

        /* Textura visual de tierra fértil */
        .parcela-tierra {
            background-color: #78350f;
            background-image: radial-gradient(#92400e 15%, transparent 16%),
                              radial-gradient(#451a03 15%, transparent 16%);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.6), 0 4px 0 #451a03;
        }

        .parcela-humeda {
            background-color: #451a03;
            background-image: radial-gradient(#78350f 15%, transparent 16%),
                              radial-gradient(#290f02 15%, transparent 16%);
        }

        /* Textura de césped */
        .pradera-cesped {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 40%, #15803d 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden select-none font-sans bg-sky-300">

    <!-- ESCENARIO SUPERIOR: Cielo, Sol/Clima, Molino y HUD -->
    <div class="relative bg-gradient-to-b from-sky-400 via-sky-300 to-emerald-200 pt-4 pb-12 px-4 overflow-hidden border-b-8 border-amber-800">
        
        <!-- Nubes decorativas -->
        <div class="absolute top-6 left-0 text-6xl opacity-80 nube-animada pointer-events-none">☁️</div>
        <div class="absolute top-16 left-1/3 text-4xl opacity-60 nube-animada pointer-events-none" style="animation-duration: 60s;">☁️</div>

        <!-- Barra Superior HUD (Estilo Juego) -->
        <header class="relative z-10 max-w-5xl mx-auto flex flex-wrap justify-between items-center gap-4 bg-amber-100/95 border-4 border-amber-700 rounded-3xl px-6 py-3 shadow-xl">
            
            <!-- Logo del Juego con el nombre de Evelin -->
            <div class="flex items-center gap-3">
                <span class="text-4xl drop-shadow">🌻</span>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-black text-amber-900 tracking-tight drop-shadow-sm" style="text-shadow: 1px 1px 0px #fde68a;">
                        EVELIN'S GARDEN
                    </h1>
                    <p class="text-xs font-bold text-emerald-700">¡Haz clic en las parcelas para cuidar tus flores!</p>
                </div>
            </div>

            <!-- Indicadores de Estado (Clima y Monedas) -->
            <div class="flex items-center gap-3">
                <!-- Clima -->
                <div class="bg-sky-100 border-2 border-sky-400 px-4 py-1.5 rounded-2xl flex items-center gap-2 shadow-inner">
                    <span id="weather-icon" class="text-2xl">☀️</span>
                    <div>
                        <p class="text-[10px] font-black uppercase text-sky-700">Clima</p>
                        <p id="weather-name" class="text-xs font-extrabold text-sky-950">Soleado</p>
                    </div>
                </div>

                <!-- Monedas -->
                <div class="bg-amber-200 border-2 border-amber-500 px-4 py-1.5 rounded-2xl flex items-center gap-2 shadow-inner">
                    <span class="text-2xl animate-bounce">🪙</span>
                    <div>
                        <p class="text-[10px] font-black uppercase text-amber-800">Monedas</p>
                        <p id="player-money" class="text-xl font-black text-amber-950">150</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Decoración del Horizonte (Granja, Molino, Árboles) -->
        <div class="max-w-5xl mx-auto mt-6 flex justify-between items-end px-4 text-5xl sm:text-6xl pointer-events-none opacity-90">
            <div class="flex items-end gap-2">
                <span>🌲</span>
                <span class="text-6xl sm:text-7xl">🏡</span>
                <span>🌳</span>
            </div>
            <div class="hidden sm:flex items-end gap-4">
                <span>🐝</span>
                <span>🌻</span>
                <span>🦋</span>
            </div>
            <div class="flex items-end gap-2">
                <span>🚜</span>
                <span class="text-6xl sm:text-7xl">🌬️</span>
                <span>🌲</span>
            </div>
        </div>
    </div>

    <!-- ESCENARIO CENTRAL: El Huerto y las Parcelas de Cultivo -->
    <main class="flex-1 pradera-cesped py-8 px-4 relative">
        
        <!-- Cerca de madera superior decorativa -->
        <div class="max-w-5xl mx-auto mb-6 flex justify-between items-center bg-amber-800/90 border-y-4 border-amber-950 px-6 py-2 rounded-xl shadow-lg text-amber-100">
            <span class="font-black text-sm tracking-wide flex items-center gap-2">
                🪵 HERRAMIENTA ACTIVA: <span id="active-tool-label" class="bg-amber-400 text-amber-950 px-3 py-0.5 rounded-full uppercase text-xs">💧 Regadera</span>
            </span>
            <button onclick="comprarParcela()" class="bg-emerald-500 hover:bg-emerald-400 text-emerald-950 font-black text-xs px-4 py-1.5 rounded-xl border-2 border-emerald-700 shadow transition transform hover:scale-105">
                ➕ Desbloquear Tierra (🪙 60)
            </button>
        </div>

        <!-- Cuadrícula de Parcelas de Tierra -->
        <div id="farm-grid" class="max-w-5xl mx-auto grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-5 pb-28">
            <!-- Las parcelas se generan aquí con JavaScript -->
        </div>
    </main>

    <!-- BARRA INFERIOR FIJA: Inventario de Herramientas y Tienda de Semillas (Estilo Móvil/Granja) -->
    <footer class="fixed bottom-0 left-0 right-0 z-30 bg-amber-950/95 border-t-4 border-amber-600 px-3 py-3 shadow-2xl backdrop-blur-md">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            
            <!-- Herramientas de Cuidado -->
            <div class="flex items-center gap-2 overflow-x-auto w-full md:w-auto justify-center">
                <button onclick="seleccionarHerramienta('regar', '💧 Regadera')" id="btn-regar" class="tool-btn ring-4 ring-amber-400 bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-2xl flex flex-col items-center min-w-[72px] transition">
                    <span class="text-2xl">💧</span>
                    <span class="text-[10px] font-black uppercase mt-0.5">Regar</span>
                </button>

                <button onclick="seleccionarHerramienta('abonar', '🍂 Abono')" id="btn-abonar" class="tool-btn bg-amber-700 hover:bg-amber-600 text-white px-3 py-2 rounded-2xl flex flex-col items-center min-w-[72px] transition">
                    <span class="text-2xl">🍂</span>
                    <span class="text-[10px] font-black uppercase mt-0.5">Abonar</span>
                </button>

                <button onclick="seleccionarHerramienta('podar', '✂️ Tijeras')" id="btn-podar" class="tool-btn bg-purple-700 hover:bg-purple-600 text-white px-3 py-2 rounded-2xl flex flex-col items-center min-w-[72px] transition">
                    <span class="text-2xl">✂️</span>
                    <span class="text-[10px] font-black uppercase mt-0.5">Podar</span>
                </button>

                <button onclick="seleccionarHerramienta('cosechar', '🧺 Cesta Venta')" id="btn-cosechar" class="tool-btn bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-2xl flex flex-col items-center min-w-[72px] transition">
                    <span class="text-2xl">🧺</span>
                    <span class="text-[10px] font-black uppercase mt-0.5">Vender</span>
                </button>

                <button onclick="seleccionarHerramienta('arrancar', '🪓 Pala')" id="btn-arrancar" class="tool-btn bg-rose-700 hover:bg-rose-600 text-white px-3 py-2 rounded-2xl flex flex-col items-center min-w-[72px] transition">
                    <span class="text-2xl">🪓</span>
                    <span class="text-[10px] font-black uppercase mt-0.5">Limpiar</span>
                </button>
            </div>

            <!-- Separador -->
            <div class="hidden md:block h-10 w-1 bg-amber-800 rounded-full"></div>

            <!-- Semillas para Plantar (Tienda Rápida) -->
            <div id="seeds-toolbar" class="flex items-center gap-2 overflow-x-auto w-full md:w-auto justify-center">
                <!-- Se llena con JS -->
            </div>

        </div>
    </footer>

    <script>
        // Catálogo de Flores y Plantas (Inspirado en la imagen)
        const catalogoPlantas = [
            { tipo: "Margarita", nombre: "Margarita Blanca", icono: "🌼", brote: "🌱", media: "🌿", costo: 20, venta: 55 },
            { tipo: "Girasol", nombre: "Girasol Dorado", icono: "🌻", brote: "🌱", media: "🌿", costo: 45, venta: 120 },
            { tipo: "FlorAzul", nombre: "Flor Celeste", icono: "💠", brote: "🌱", media: "🌿", costo: 80, venta: 210 },
            { tipo: "Rosa", nombre: "Rosa Real", icono: "🌹", brote: "🌱", media: "🌿", costo: 130, venta: 350 }
        ];

        const climas = [
            { id: "soleado", nombre: "Soleado", icono: "☀️", efectoAgua: 3 },
            { id: "nublado", nombre: "Nublado", icono: "⛅", efectoAgua: 1.5 },
            { id: "lluvia", nombre: "Lluvia Suave", icono: "🌧️", efectoAgua: -4 }
        ];

        // Estado del juego
        let herramientaActual = "regar"; // 'regar', 'abonar', 'podar', 'cosechar', 'arrancar', o 'semilla:Tipo'

        let gameState = {
            money: 150,
            lastUpdate: Date.now(),
            clima: "soleado",
            ultimoClima: Date.now(),
            parcelas: [
                { id: 1, tipo: "Margarita", salud: 100, agua: 80, abono: 70, progreso: 40 },
                { id: 2, tipo: "Girasol", salud: 100, agua: 60, abono: 60, progreso: 100 },
                { id: 3, tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0 },
                { id: 4, tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0 }
            ]
        };

        function cargarJuego() {
            const saved = localStorage.getItem('evelins_garden_farm_v1');
            if (saved) {
                gameState = JSON.parse(saved);
                actualizarClima();
                simularTiempoOffline();
            }
        }

        function guardarJuego() {
            gameState.lastUpdate = Date.now();
            localStorage.setItem('evelins_garden_farm_v1', JSON.stringify(gameState));
        }

        // Simula el paso del tiempo real mientras la pestaña estaba cerrada
        function simularTiempoOffline() {
            const ahora = Date.now();
            const segundos = Math.floor((ahora - gameState.lastUpdate) / 1000);
            if (segundos < 5) return;

            const ciclos = Math.floor(segundos / 3);
            const climaObj = climas.find(c => c.id === gameState.clima) || climas[0];

            gameState.parcelas.forEach(p => {
                if (p.tipo && p.salud > 0 && p.progreso < 100) {
                    p.agua = Math.min(100, Math.max(0, p.agua - (ciclos * climaObj.efectoAgua)));
                    p.abono = Math.max(0, p.abono - (ciclos * 1));

                    if (p.agua <= 10 || p.abono <= 5) {
                        p.salud = Math.max(0, p.salud - (ciclos * 3));
                    }
                    if (p.salud > 20 && p.agua > 10) {
                        p.progreso = Math.min(100, p.progreso + (ciclos * 2));
                    }
                }
            });
            guardarJuego();
        }

        function actualizarClima() {
            const ahora = Date.now();
            if (!gameState.ultimoClima || (ahora - gameState.ultimoClima > 90000)) {
                const randomClima = climas[Math.floor(Math.random() * climas.length)];
                gameState.clima = randomClima.id;
                gameState.ultimoClima = ahora;
                guardarJuego();
            }
            const climaObj = climas.find(c => c.id === gameState.clima) || climas[0];
            document.getElementById('weather-icon').innerText = climaObj.icono;
            document.getElementById('weather-name').innerText = climaObj.nombre;
        }

        // Seleccionar herramienta o semilla de la barra inferior
        function seleccionarHerramienta(codigo, etiqueta) {
            herramientaActual = codigo;
            document.getElementById('active-tool-label').innerText = etiqueta;

            // Resaltar botón activo
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('ring-4', 'ring-amber-400', 'scale-105'));
            const activo = document.getElementById(`btn-${codigo.replace(':', '-')}`);
            if (activo) activo.classList.add('ring-4', 'ring-amber-400', 'scale-105');
        }

        // Efecto visual flotante sobre la parcela
        function lanzarEfecto(index, texto, bgClass) {
            const celda = document.getElementById(`parcela-${index}`);
            if (!celda) return;
            const badge = document.createElement('div');
            badge.className = `efecto-flotante absolute top-2 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full font-black text-xs shadow-lg z-20 whitespace-nowrap ${bgClass}`;
            badge.innerText = texto;
            celda.appendChild(badge);
            setTimeout(() => badge.remove(), 1000);
        }

        // Interacción directa al hacer clic en una parcela de tierra
        function interactuarParcela(index) {
            const p = gameState.parcelas[index];

            // Caso 1: Plantar una semilla
            if (herramientaActual.startsWith('semilla:')) {
                const tipoSemilla = herramientaActual.split(':')[1];
                const info = catalogoPlantas.find(c => c.tipo === tipoSemilla);

                if (p.tipo !== null) {
                    lanzarEfecto(index, "¡Tierra ocupada!", "bg-rose-600 text-white");
                    return;
                }
                if (gameState.money < info.costo) {
                    lanzarEfecto(index, "¡Faltan monedas!", "bg-rose-600 text-white");
                    return;
                }

                gameState.money -= info.costo;
                gameState.parcelas[index] = {
                    id: p.id,
                    tipo: info.tipo,
                    salud: 100,
                    agua: 85,
                    abono: 85,
                    progreso: 0
                };
                guardarJuego();
                renderizarTodo();
                lanzarEfecto(index, `🌱 ¡Sembrada!`, "bg-emerald-500 text-emerald-950");
                return;
            }

            // Si la parcela está vacía y no tiene semilla seleccionada
            if (p.tipo === null) {
                lanzarEfecto(index, "Elige una semilla abajo 👇", "bg-amber-200 text-amber-950");
                return;
            }

            // Caso 2: Arrancar / Limpiar con pala
            if (herramientaActual === 'arrancar') {
                gameState.parcelas[index] = { id: p.id, tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0 };
                guardarJuego();
                renderizarTodo();
                lanzarEfecto(index, "🪓 Tierra limpia", "bg-stone-700 text-white");
                return;
            }

            // Si está marchita, solo se puede limpiar
            if (p.salud <= 0) {
                lanzarEfecto(index, "¡Está marchita! Usa la Pala 🪓", "bg-rose-600 text-white");
                return;
            }

            // Caso 3: Regar
            if (herramientaActual === 'regar') {
                p.agua = 100;
                p.salud = Math.min(100, p.salud + 10);
                guardarJuego();
                renderizarTodo();
                lanzarEfecto(index, "+💧 ¡Regada!", "bg-blue-500 text-white");
            }
            // Caso 4: Abonar
            else if (herramientaActual === 'abonar') {
                p.abono = 100;
                p.progreso = Math.min(100, p.progreso + 10);
                guardarJuego();
                renderizarTodo();
                lanzarEfecto(index, "+🍂 ¡Abonada!", "bg-amber-600 text-white");
            }
            // Caso 5: Podar
            else if (herramientaActual === 'podar') {
                p.progreso = Math.min(100, p.progreso + 20);
                guardarJuego();
                renderizarTodo();
                lanzarEfecto(index, "✂️ ¡Podada! +20%", "bg-purple-600 text-white");
            }
            // Caso 6: Cosechar y vender
            else if (herramientaActual === 'cosechar') {
                if (p.progreso < 100) {
                    lanzarEfecto(index, "¡Aún no florece! 🌸", "bg-amber-500 text-amber-950");
                    return;
                }
                const info = catalogoPlantas.find(c => c.tipo === p.tipo);
                gameState.money += info.venta;
                gameState.parcelas[index] = { id: p.id, tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0 };
                guardarJuego();
                renderizarTodo();
                lanzarEfecto(index, `+🪙 ${info.venta} ¡Vendida!`, "bg-amber-400 text-amber-950");
            }
        }

        function comprarParcela() {
            const costo = 60;
            if (gameState.money < costo) {
                alert("¡Necesitas 🪙 60 monedas para desbloquear otro cuadro de tierra!");
                return;
            }
            gameState.money -= costo;
            gameState.parcelas.push({
                id: gameState.parcelas.length + 1,
                tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0
            });
            guardarJuego();
            renderizarTodo();
        }

        // Dibujar barra inferior de semillas
        function renderizarSemillas() {
            const container = document.getElementById('seeds-toolbar');
            container.innerHTML = '';
            catalogoPlantas.forEach(planta => {
                const btnId = `btn-semilla-${planta.tipo}`;
                const esActiva = herramientaActual === `semilla:${planta.tipo}`;
                container.innerHTML += `
                    <button onclick="seleccionarHerramienta('semilla:${planta.tipo}', '${planta.icono} Semilla de ${planta.nombre}')" 
                            id="${btnId}" 
                            class="tool-btn ${esActiva ? 'ring-4 ring-amber-400 scale-105' : ''} bg-emerald-800 hover:bg-emerald-700 border border-emerald-500 text-white px-3 py-1.5 rounded-2xl flex flex-col items-center min-w-[78px] transition">
                        <span class="text-2xl">${planta.icono}</span>
                        <span class="text-[10px] font-black text-amber-300">🪙 ${planta.costo}</span>
                    </button>
                `;
            });
        }

        // Dibujar las parcelas visuales en el huerto
        function renderizarHuerto() {
            document.getElementById('player-money').innerText = gameState.money;
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';

            gameState.parcelas.forEach((p, index) => {
                const estaHumeda = p.agua > 40;
                const claseTierra = estaHumeda ? 'parcela-tierra parcela-humeda' : 'parcela-tierra';

                if (!p.tipo) {
                    // Parcela vacía lista para sembrar
                    grid.innerHTML += `
                        <div id="parcela-${index}" onclick="interactuarParcela(${index})" 
                             class="${claseTierra} rounded-3xl h-48 border-4 border-amber-900/80 flex flex-col items-center justify-center cursor-pointer hover:brightness-110 transition transform hover:scale-[1.02] relative group">
                            <span class="text-3xl opacity-30 group-hover:opacity-70 transition">🕳️</span>
                            <span class="text-xs font-extrabold text-amber-200/60 mt-2">Tierra Fértil</span>
                        </div>
                    `;
                } else {
                    const info = catalogoPlantas.find(c => c.tipo === p.tipo);
                    const madura = p.progreso >= 100;
                    const muerta = p.salud <= 0;

                    // Elegir visual de crecimiento
                    let visualPlanta = info.brote;
                    let tamanoVisual = "text-4xl";

                    if (muerta) {
                        visualPlanta = "🥀";
                        tamanoVisual = "text-5xl";
                    } else if (p.progreso >= 100) {
                        visualPlanta = info.icono;
                        tamanoVisual = "text-6xl sm:text-7xl drop-shadow-xl";
                    } else if (p.progreso >= 50) {
                        visualPlanta = info.media;
                        tamanoVisual = "text-5xl";
                    }

                    // Alertas visuales encima de la planta si necesita algo
                    let globoAlerta = "";
                    if (muerta) {
                        globoAlerta = `<span class="absolute top-2 right-2 bg-rose-600 text-white text-[10px] font-black px-2 py-0.5 rounded-full animate-bounce">¡Marchita!</span>`;
                    } else if (madura) {
                        globoAlerta = `<span class="absolute top-2 right-2 bg-amber-400 text-amber-950 text-[10px] font-black px-2.5 py-0.5 rounded-full shadow animate-bounce">💰 ¡Cosechar!</span>`;
                    } else if (p.agua < 30) {
                        globoAlerta = `<span class="absolute top-2 right-2 bg-blue-500 text-white text-xs px-2 py-0.5 rounded-full animate-pulse">💧</span>`;
                    }

                    grid.innerHTML += `
                        <div id="parcela-${index}" onclick="interactuarParcela(${index})" 
                             class="${claseTierra} rounded-3xl h-48 border-4 ${madura ? 'border-amber-400' : 'border-amber-900'} flex flex-col items-center justify-between p-3 cursor-pointer hover:brightness-110 transition transform hover:scale-[1.02] relative">
                            
                            ${globoAlerta}

                            <!-- Planta en el centro de la tierra -->
                            <div class="flex-1 flex items-center justify-center">
                                <span class="${tamanoVisual} ${muerta ? '' : 'planta-viva'} select-none transition-all duration-500">
                                    ${visualPlanta}
                                </span>
                            </div>

                            <!-- Mini indicadores discretos en el borde inferior de la tierra -->
                            <div class="w-full bg-black/50 backdrop-blur-xs rounded-xl p-1.5 space-y-1">
                                <div class="flex justify-between text-[10px] font-bold text-amber-100 px-1">
                                    <span>${info.nombre}</span>
                                    <span>${Math.round(p.progreso)}%</span>
                                </div>
                                <!-- Barra de crecimiento -->
                                <div class="w-full bg-stone-800 h-1.5 rounded-full overflow-hidden">
                                    <div class="bg-emerald-400 h-1.5 transition-all duration-300" style="width: ${p.progreso}%"></div>
                                </div>
                                <!-- Mini barras de agua y salud -->
                                <div class="grid grid-cols-2 gap-1 pt-0.5">
                                    <div class="w-full bg-stone-800 h-1 rounded-full overflow-hidden" title="Agua">
                                        <div class="bg-blue-400 h-1" style="width: ${p.agua}%"></div>
                                    </div>
                                    <div class="w-full bg-stone-800 h-1 rounded-full overflow-hidden" title="Salud">
                                        <div class="bg-rose-500 h-1" style="width: ${p.salud}%"></div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    `;
                }
            });
        }

        function renderizarTodo() {
            renderizarSemillas();
            renderizarHuerto();
        }

        // Bucle en tiempo real (cada 3 segundos)
        setInterval(() => {
            actualizarClima();
            const climaObj = climas.find(c => c.id === gameState.clima) || climas[0];
            let huboCambios = false;

            gameState.parcelas.forEach(p => {
                if (p.tipo && p.salud > 0 && p.progreso < 100) {
                    p.agua = Math.min(100, Math.max(0, p.agua - climaObj.efectoAgua));
                    p.abono = Math.max(0, p.abono - 1);

                    if (p.agua <= 10 || p.abono <= 5) {
                        p.salud = Math.max(0, p.salud - 3);
                    }
                    if (p.salud > 20 && p.agua > 10) {
                        p.progreso = Math.min(100, p.progreso + 2);
                    }
                    huboCambios = true;
                }
            });

            if (huboCambios) {
                guardarJuego();
                renderizarHuerto();
            }
        }, 3000);

        // Iniciar juego
        cargarJuego();
        renderizarTodo();
    </script>
</body>
</html>
