<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Evelin's Garden: Defensa y Combate</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
        html, body {
            width: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .battle-world {
            background-color: #1e293b;
            background-image: 
                radial-gradient(#334155 15%, transparent 16%),
                radial-gradient(#0f172a 10%, transparent 11%);
            background-size: 32px 32px;
            background-position: 0 0, 16px 16px;
        }

        .plot-battle {
            background: linear-gradient(145deg, #78350f, #451a03);
            box-shadow: 0 5px 0 #290f02, 0 8px 12px rgba(0,0,0,0.5);
            transition: transform 0.08s ease;
        }
        .plot-battle:active {
            transform: scale(0.94);
        }

        @keyframes danioFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(2) sepia(1) hue-rotate(-50deg); }
        }
        .enemigo-herido {
            animation: danioFlash 0.2s ease;
        }

        @keyframes explosionParticula {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.4); opacity: 0; }
        }
        .particula-explosion {
            animation: explosionParticula 0.5s ease-out forwards;
            pointer-events: none;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col justify-between battle-world relative">

    <!-- HUD SUPERIOR DE COMBATE -->
    <header class="relative z-20 px-3 pt-3 flex items-center justify-between gap-2 bg-slate-950/80 backdrop-blur-md pb-3 border-b border-white/10">
        
        <!-- Oleada y Vidas del Jardín -->
        <div class="flex items-center gap-2 bg-slate-900 border-2 border-rose-500/60 rounded-full px-3.5 py-1 shadow-lg text-white">
            <span class="text-base">❤️</span>
            <span id="hud-lives" class="font-black text-rose-400 text-sm">5 / 5</span>
        </div>

        <!-- Oleada actual -->
        <div class="bg-amber-500 text-slate-950 font-black text-xs px-3 py-1 rounded-full shadow border border-amber-200">
            OLEADA <span id="hud-wave">1</span>
        </div>

        <!-- Monedas / Puntuación de Batalla -->
        <div class="flex items-center gap-1.5 bg-slate-900 border-2 border-amber-400/60 rounded-full px-3.5 py-1 shadow-lg">
            <span class="text-base">🪙</span>
            <span id="hud-money" class="font-black text-amber-300 text-sm">150</span>
        </div>
    </header>

    <!-- ÁREA DE BATALLA / HUERTO -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 relative z-10">
        
        <!-- Aviso de Combate -->
        <div id="battle-alert" class="mb-3 bg-rose-950/90 border-2 border-rose-600 text-rose-200 font-black text-xs px-4 py-1.5 rounded-full shadow-lg animate-pulse text-center">
            ⚔️ ¡DEFIENDE EL HUERTO! Toca a las plagas para destruirlas.
        </div>

        <!-- Grid de Parcelas de Defensa (Gardenscapes estilo combate) -->
        <div id="farm-grid" class="w-full max-w-md grid grid-cols-3 gap-3 p-3 bg-slate-900/50 rounded-3xl border-2 border-slate-700/50 backdrop-blur-xs">
            <!-- Generado por JS -->
        </div>
    </main>

    <!-- DOCK INFERIOR DE ARMAS Y DEFENSA -->
    <footer class="relative z-20 bg-slate-950 border-t border-white/15 pt-2 pb-4 px-3 rounded-t-3xl shadow-2xl">
        <div class="flex justify-between items-center gap-2">
            <button onclick="comprarArma('torre')" class="flex-1 bg-emerald-700 active:scale-95 text-white font-black text-xs py-2.5 px-2 rounded-2xl border border-emerald-400/50 flex flex-col items-center shadow">
                <span class="text-2xl">🌵</span>
                <span>Planta Espinosa (🪙50)</span>
            </button>
            <button onclick="comprarArma('bomba')" class="flex-1 bg-rose-700 active:scale-95 text-white font-black text-xs py-2.5 px-2 rounded-2xl border border-rose-400/50 flex flex-col items-center shadow">
                <span class="text-2xl">💣</span>
                <span>Bomba Rápida (🪙80)</span>
            </button>
            <button onclick="repararJardin()" class="flex-1 bg-sky-700 active:scale-95 text-white font-black text-xs py-2.5 px-2 rounded-2xl border border-sky-400/50 flex flex-col items-center shadow">
                <span class="text-2xl">💖</span>
                <span>Curar Vida (🪙60)</span>
            </button>
        </div>
    </footer>

    <script>
        let state = {
            money: 200,
            lives: 5,
            wave: 1,
            plots: [
                { id: 0, tipo: 'flor', hp: 100, enemigo: null },
                { id: 1, tipo: 'flor', hp: 100, enemigo: null },
                { id: 2, tipo: 'flor', hp: 100, enemigo: null },
                { id: 3, tipo: 'flor', hp: 100, enemigo: null },
                { id: 4, tipo: 'flor', hp: 100, enemigo: null },
                { id: 5, tipo: 'flor', hp: 100, enemigo: null }
            ]
        };

        const ENEMIGOS = [
            { nombre: 'Gusano', icono: '🐛', hp: 2, recompensa: 25, dao: 1 },
            { nombre: 'Escarabajo', icono: '🪲', hp: 4, recompensa: 45, dao: 2 },
            { nombre: 'Monstruo Raíz', icono: '🧟', hp: 6, recompensa: 80, dao: 3 }
        ];

        function explosionEfecto(plotIdx, icono) {
            const plotEl = document.getElementById(`plot-${plotIdx}`);
            if(!plotEl) return;
            for(let i=0; i<6; i++) {
                const p = document.createElement('div');
                p.className = 'absolute text-xl particula-explosion z-30';
                p.innerText = icono;
                const tx = (Math.random() - 0.5) * 120;
                const ty = (Math.random() - 0.5) * 120;
                p.style.setProperty('--tx', `${tx}px`);
                p.style.setProperty('--ty', `${ty}px`);
                plotEl.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        function golpearEnemigo(idx) {
            const p = state.plots[idx];
            if (!p.enemigo) return;

            p.enemigo.hp -= 1;
            const el = document.getElementById(`plot-${idx}`);
            if(el) {
                el.classList.add('enemigo-herido');
                setTimeout(() => el.classList.remove('enemigo-herido'), 200);
            }

            if (p.enemigo.hp <= 0) {
                explosionEfecto(idx, '💥');
                state.money += p.enemigo.recompensa;
                p.enemigo = null;
            }
            renderBattle();
        }

        function comprarArma(tipo) {
            if (tipo === 'torre' && state.money >= 50) {
                state.money -= 50;
                // Añade defensa automática a una parcela aleatoria
                const libres = state.plots.filter(p => p.tipo === 'flor');
                if(libres.length > 0) {
                    libres[0].tipo = 'defensa';
                }
            } else if (tipo === 'bomba' && state.money >= 80) {
                state.money -= 80;
                // Mata a todos los enemigos actuales en pantalla de golpe
                state.plots.forEach((p, idx) => {
                    if(p.enemigo) {
                        explosionEfecto(idx, '🔥');
                        state.money += p.enemigo.recompensa;
                        p.enemigo = null;
                    }
                });
            } else if (tipo === 'reparar' && state.money >= 60) {
                state.money -= 60;
                state.lives = Math.min(5, state.lives + 2);
            }
            renderBattle();
        }

        function repararJardin() {
            comprarArma('reparar');
        }

        function renderBattle() {
            document.getElementById('hud-money').innerText = state.money;
            document.getElementById('hud-lives').innerText = `${state.lives} / 5`;
            document.getElementById('hud-wave').innerText = state.wave;

            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';

            state.plots.forEach((p, idx) => {
                let contenido = '';
                if (p.enemigo) {
                    contenido = `
                        <div class="text-5xl animate-bounce filter drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)]">${p.enemigo.icono}</div>
                        <div class="absolute top-2 bg-rose-600 text-white font-black text-xs px-2 py-0.5 rounded-full border border-white">HP: ${p.enemigo.hp}</div>
                    `;
                } else if (p.tipo === 'defensa') {
                    contenido = `<span class="text-5xl">🌵</span><span class="absolute bottom-2 text-[10px] font-black text-emerald-300">DEFENSA</span>`;
                } else {
                    contenido = `<span class="text-5xl">🌻</span><span class="absolute bottom-2 text-[10px] font-black text-amber-200">FLOR SANA</span>`;
                }

                grid.innerHTML += `
                    <div id="plot-${idx}" onclick="golpearEnemigo(${idx})" 
                         class="plot-battle aspect-square rounded-2xl border-2 ${p.enemigo ? 'border-rose-500 animate-pulse' : 'border-amber-900'} flex flex-col items-center justify-center relative cursor-pointer">
                        ${contenido}
                    </div>
                `;
            });
        }

        // Sistema de oleadas y ataques enemigos automáticos en tiempo real
        setInterval(() => {
            if (state.lives <= 0) return;

            // Aparecer enemigos en parcelas libres
            state.plots.forEach(p => {
                if (!p.enemigo && Math.random() < 0.35) {
                    const template = ENEMIGOS[Math.floor(Math.random() * Math.min(ENEMIGOS.length, state.wave))];
                    p.enemigo = { ...template, hp: template.hp + Math.floor(state.wave / 2) };
                } else if (p.enemigo) {
                    // El enemigo ataca la flor o defensa
                    if (p.tipo === 'defensa') {
                        p.tipo = 'flor'; // La defensa frena un ataque
                        p.enemigo.hp -= 1;
                        if(p.enemigo.hp <= 0) p.enemigo = null;
                    } else {
                        state.lives -= p.enemigo.dao;
                        if (state.lives <= 0) {
                            state.lives = 0;
                            alert('💥 ¡El huerto fue destruido! Reiniciando defensa...');
                            location.reload();
                        }
                    }
                }
            });

            // Subir de oleada cada cierto tiempo
            state.wave++;
            renderBattle();
        }, 5000);

        renderBattle();
    </script>
</body>
</html>
