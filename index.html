<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 Evelin's Garden - El Jardín de la Abuela</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes balanceo {
            0%, 100% { transform: rotate(-2deg) scale(1); }
            50% { transform: rotate(2deg) scale(1.04); }
        }
        .planta-viva {
            animation: balanceo 3.5s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes flotarArriba {
            0% { opacity: 1; transform: translateY(0) scale(0.9); }
            80% { opacity: 1; transform: translateY(-45px) scale(1.1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.1); }
        }
        .efecto-flotante {
            animation: flotarArriba 1.6s ease-out forwards;
            pointer-events: none;
        }

        .parcela-tierra {
            background-color: #78350f;
            background-image: radial-gradient(#92400e 15%, transparent 16%),
                              radial-gradient(#451a03 15%, transparent 16%);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            box-shadow: inset 0 8px 14px rgba(0,0,0,0.6), 0 6px 0 #451a03;
        }

        .parcela-humeda {
            background-color: #451a03;
            background-image: radial-gradient(#78350f 15%, transparent 16%),
                              radial-gradient(#290f02 15%, transparent 16%);
        }

        .pradera-cesped {
            background: linear-gradient(180deg, #4ade80 0%, #22c55e 40%, #15803d 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden select-none font-sans bg-sky-300 text-lg">

    <!-- ESCENARIO SUPERIOR -->
    <div class="relative bg-gradient-to-b from-sky-400 via-sky-300 to-emerald-200 pt-5 pb-8 px-4 border-b-8 border-amber-900">
        
        <!-- Barra Superior HUD -->
        <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 bg-amber-50 border-4 border-amber-800 rounded-3xl px-6 py-4 shadow-xl mb-6">
            <div class="flex items-center gap-4 text-center md:text-left">
                <span class="text-5xl">🌻</span>
                <div>
                    <h1 class="text-3xl sm:text-4xl font-black text-amber-950 tracking-tight">
                        EVELIN'S GARDEN
                    </h1>
                    <p class="text-base sm:text-lg font-bold text-emerald-800">Toca una herramienta abajo y luego toca la tierra</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="bg-sky-100 border-3 border-sky-600 px-5 py-2.5 rounded-2xl flex items-center gap-3">
                    <span id="weather-icon" class="text-4xl">☀️</span>
                    <div>
                        <p class="text-xs font-black uppercase text-sky-800">CLIMA</p>
                        <p id="weather-name" class="text-lg font-black text-sky-950">Soleado</p>
                    </div>
                </div>

                <div class="bg-amber-200 border-3 border-amber-600 px-5 py-2.5 rounded-2xl flex items-center gap-3">
                    <span class="text-4xl">🪙</span>
                    <div>
                        <p class="text-xs font-black uppercase text-amber-900">MONEDAS</p>
                        <p id="player-money" class="text-3xl font-black text-amber-950">150</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- AVISO VISUAL GRANDE -->
        <div id="visual-banner" class="max-w-6xl mx-auto mb-5 bg-white border-4 border-emerald-700 rounded-2xl px-6 py-3 text-center shadow-lg transition-all">
            <p id="visual-banner-text" class="text-xl sm:text-2xl font-black text-emerald-950">
                👋 ¡Hola Abuela! Elige una semilla o herramienta para comenzar.
            </p>
        </div>

        <!-- TABLÓN DE PEDIDOS -->
        <section class="max-w-6xl mx-auto bg-amber-900 border-4 border-amber-950 rounded-3xl p-5 shadow-2xl">
            <h2 class="text-amber-100 font-black text-xl uppercase mb-4 flex items-center gap-2">
                📜 Pedidos de los Vecinos (Pagan el doble)
            </h2>
            <div id="orders-container" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>
    </div>

    <!-- ESCENARIO CENTRAL: El Huerto -->
    <main class="flex-1 pradera-cesped py-8 px-4 relative">
        <div class="max-w-6xl mx-auto mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-amber-950 border-4 border-amber-600 px-6 py-4 rounded-2xl shadow-xl text-white">
            <div class="text-lg sm:text-2xl font-black flex items-center gap-3 flex-wrap justify-center">
                <span>ESTÁS USANDO:</span>
                <span id="active-tool-label" class="bg-amber-400 text-amber-950 px-4 py-1 rounded-xl text-xl sm:text-2xl">💧 REGADERA</span>
            </div>
            <button onclick="comprarParcela()" class="bg-emerald-400 hover:bg-emerald-300 text-emerald-950 font-black text-base sm:text-lg px-5 py-3 rounded-2xl border-3 border-emerald-800 shadow-lg cursor-pointer">
                ➕ MÁS TIERRA (🪙 60)
            </button>
        </div>

        <div id="farm-grid" class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-64"></div>
    </main>

    <!-- BARRA INFERIOR CON SCROLL PARA MUCHAS PLANTAS Y HERRAMIENTAS -->
    <footer class="fixed bottom-0 left-0 right-0 z-30 bg-amber-950 border-t-4 border-amber-500 px-3 py-3 shadow-2xl">
        <div class="max-w-6xl mx-auto flex flex-col gap-3">
            
            <!-- Herramientas -->
            <div class="flex items-center gap-2 sm:gap-3 overflow-x-auto justify-start sm:justify-center pb-1">
                <button onclick="seleccionarHerramienta('regar', '💧 REGADERA')" id="btn-regar" class="tool-btn ring-4 ring-amber-300 bg-blue-600 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer">
                    <span class="text-3xl">💧</span>
                    <span class="text-base sm:text-lg font-black uppercase">Regar</span>
                </button>

                <button onclick="seleccionarHerramienta('abonar', '🍂 ABONO')" id="btn-abonar" class="tool-btn bg-amber-700 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer">
                    <span class="text-3xl">🍂</span>
                    <span class="text-base sm:text-lg font-black uppercase">Abonar</span>
                </button>

                <button onclick="seleccionarHerramienta('podar', '✂️ TIJERAS')" id="btn-podar" class="tool-btn bg-purple-700 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer">
                    <span class="text-3xl">✂️</span>
                    <span class="text-base sm:text-lg font-black uppercase">Podar</span>
                </button>

                <button onclick="seleccionarHerramienta('cosechar', '🧺 COSECHAR')" id="btn-cosechar" class="tool-btn bg-emerald-600 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer">
                    <span class="text-3xl">🧺</span>
                    <span class="text-base sm:text-lg font-black uppercase">Recoger</span>
                </button>

                <button onclick="seleccionarHerramienta('arrancar', '🪓 PALA')" id="btn-arrancar" class="tool-btn bg-rose-700 text-white px-4 py-2.5 rounded-2xl flex items-center gap-2 shrink-0 cursor-pointer">
                    <span class="text-3xl">🪓</span>
                    <span class="text-base sm:text-lg font-black uppercase">Limpiar</span>
                </button>
            </div>

            <!-- Semillas (Flores y Plantas de Té con scroll horizontal) -->
            <div id="seeds-toolbar" class="flex items-center gap-2 sm:gap-3 overflow-x-auto justify-start sm:justify-center pb-1"></div>

        </div>
    </footer>

    <script>
        // Catálogo ampliado con Flores y Plantas Medicinales / de Té con descripciones cortas
        const catalogoPlantas = [
            // Flores Ornamentales
            { tipo: "Margarita", nombre: "Margarita", icono: "🌼", brote: "🌱", media: "🌿", costo: 20, venta: 55, desc: "Flor alegre y fácil de cuidar." },
            { tipo: "Girasol", nombre: "Girasol", icono: "🌻", brote: "🌱", media: "🌿", costo: 45, venta: 120, desc: "Busca siempre la luz del sol." },
            { tipo: "Rosa", nombre: "Rosa", icono: "🌹", brote: "🌱", media: "🌿", costo: 130, venta: 350, desc: "Hermosa y de gran valor." },
            { tipo: "Tulipan", nombre: "Tulipán", icono: "🌷", brote: "🌱", media: "🌿", costo: 90, venta: 240, desc: "Elegante flor de primavera." },
            
            // Plantas para Té e Infusiones
            { tipo: "Manzanilla", nombre: "Manzanilla", icono: "🌼", brote: "🌱", media: "🌿", costo: 25, venta: 70, desc: "Té ideal para calmar los nervios." },
            { tipo: "Menta", nombre: "Menta", icono: "🌿", brote: "🌱", media: "🌿", costo: 35, venta: 95, desc: "Té fresco para el estómago." },
            { tipo: "Jengibre", nombre: "Jengibre", icono: "🫚", brote: "🌱", media: "🌿", costo: 60, venta: 160, desc: "Té medicinal para la garganta." },
            { tipo: "Lavanda", nombre: "Lavanda", icono: "🪻", brote: "🌱", media: "🌿", costo: 75, venta: 200, desc: "Infusión relajante para dormir bien." },
            { tipo: "Eukalipto", nombre: "Eucalipto", icon: "🍃", icono: "🍃", brote: "🌱", media: "🌿", costo: 100, venta: 270, desc: "Excelente té para respirar mejor." }
        ];

        const climas = [
            { id: "soleado", nombre: "Soleado", icono: "☀️", efectoAgua: 1.5 },
            { id: "nublado", nombre: "Nublado", icono: "⛅", efectoAgua: 0.8 },
            { id: "lluvia", nombre: "Lluvia", icono: "🌧️", efectoAgua: -4 }
        ];

        let herramientaActual = "regar";

        let gameState = {
            money: 180,
            lastUpdate: Date.now(),
            clima: "soleado",
            ultimoClima: Date.now(),
            inventario: { Margarita: 0, Girasol: 0, Rosa: 0, Tulipan: 0, Manzanilla: 0, Menta: 0, Jengibre: 0, Lavanda: 0, Eukalipto: 0 },
            pedidos: [
                { id: 1, cliente: "👴 Don Mateo", tipo: "Manzanilla", cantidad: 2, recompensa: 180 },
                { id: 2, cliente: "👩‍🌾 Doña Rosa", tipo: "Girasol", cantidad: 1, recompensa: 200 },
                { id: 3, cliente: "👧 Sofía", tipo: "Menta", cantidad: 2, recompensa: 240 }
            ],
            parcelas: [
                { id: 1, tipo: "Manzanilla", salud: 100, agua: 90, abono: 90, progreso: 60 },
                { id: 2, tipo: "Girasol", salud: 100, agua: 80, abono: 80, progreso: 100 },
                { id: 3, tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0 }
            ]
        };

        function avisarEnPantalla(mensaje, tipo = "info") {
            const banner = document.getElementById('visual-banner');
            const texto = document.getElementById('visual-banner-text');
            texto.innerText = mensaje;

            banner.className = "max-w-6xl mx-auto mb-5 border-4 rounded-2xl px-6 py-3 text-center shadow-lg transition-all ";
            if (tipo === "error") {
                banner.className += "bg-rose-100 border-rose-700 text-rose-950";
            } else if (tipo === "exito") {
                banner.className += "bg-amber-100 border-amber-600 text-amber-950";
            } else {
                banner.className += "bg-white border-emerald-700 text-emerald-950";
            }
        }

        function cargarJuego() {
            const saved = localStorage.getItem('evelins_garden_abuela_v2');
            if (saved) {
                gameState = JSON.parse(saved);
                actualizarClima();
            }
        }

        function guardarJuego() {
            gameState.lastUpdate = Date.now();
            localStorage.setItem('evelins_garden_abuela_v2', JSON.stringify(gameState));
        }

        function actualizarClima() {
            const ahora = Date.now();
            if (!gameState.ultimoClima || (ahora - gameState.ultimoClima > 120000)) {
                const randomClima = climas[Math.floor(Math.random() * climas.length)];
                gameState.clima = randomClima.id;
                gameState.ultimoClima = ahora;
                guardarJuego();
                avisarEnPantalla(`${randomClima.icono} ¡El clima cambió a ${randomClima.nombre}!`, "info");
            }
            const climaObj = climas.find(c => c.id === gameState.clima) || climas[0];
            document.getElementById('weather-icon').innerText = climaObj.icono;
            document.getElementById('weather-name').innerText = climaObj.nombre;
        }

        function seleccionarHerramienta(codigo, etiqueta) {
            herramientaActual = codigo;
            document.getElementById('active-tool-label').innerText = etiqueta;
            avisarEnPantalla(`Seleccionaste: ${etiqueta}. Ahora toca un cuadro de tierra.`, "info");

            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('ring-4', 'ring-amber-300', 'scale-105'));
            const activo = document.getElementById(`btn-${codigo.replace(':', '-')}`);
            if (activo) activo.classList.add('ring-4', 'ring-amber-300', 'scale-105');
        }

        function lanzarEfecto(index, texto, bgClass) {
            const celda = document.getElementById(`parcela-${index}`);
            if (!celda) return;
            const badge = document.createElement('div');
            badge.className = `efecto-flotante absolute top-3 left-1/2 -translate-x-1/2 px-4 py-2 rounded-2xl font-black text-lg shadow-xl z-20 whitespace-nowrap border-2 border-white ${bgClass}`;
            badge.innerText = texto;
            celda.appendChild(badge);
            setTimeout(() => badge.remove(), 1600);
        }

        function interactuarParcela(index) {
            const p = gameState.parcelas[index];

            if (herramientaActual.startsWith('semilla:')) {
                const tipoSemilla = herramientaActual.split(':')[1];
                const info = catalogoPlantas.find(c => c.tipo === tipoSemilla);

                if (p.tipo !== null) {
                    avisarEnPantalla("⚠️ Esa tierra ya tiene una planta. Elige un cuadro vacío.", "error");
                    lanzarEfecto(index, "¡Ocupado!", "bg-rose-600 text-white");
                    return;
                }
                if (gameState.money < info.costo) {
                    avisarEnPantalla("⚠️ No tienes suficientes monedas para esa semilla.", "error");
                    lanzarEfecto(index, "¡Faltan monedas!", "bg-rose-600 text-white");
                    return;
                }

                gameState.money -= info.costo;
                gameState.parcelas[index] = {
                    id: p.id, tipo: info.tipo, salud: 100, agua: 90, abono: 90, progreso: 0
                };
                guardarJuego();
                renderizarTodo();
                avisarEnPantalla(`🌱 ¡Sembraste ${info.nombre}! (${info.desc})`, "exito");
                lanzarEfecto(index, `🌱 ¡Sembrada!`, "bg-emerald-500 text-emerald-950");
                return;
            }

            if (p.tipo === null) {
                avisarEnPantalla("👇 Tierra vacía. Elige una semilla o planta de té abajo.", "info");
                lanzarEfecto(index, "Tierra vacía", "bg-amber-200 text-amber-950");
                return;
            }

            if (herramientaActual === 'arrancar') {
                gameState.parcelas[index] = { id: p.id, tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0 };
                guardarJuego();
                renderizarTodo();
                avisarEnPantalla("🪓 Tierra limpia y lista para sembrar.", "info");
                lanzarEfecto(index, "🪓 ¡Limpia!", "bg-stone-800 text-white");
                return;
            }

            if (p.salud <= 0) {
                avisarEnPantalla("🥀 Esta planta se marchitó. Usa la PALA 🪓 para limpiar la tierra.", "error");
                lanzarEfecto(index, "¡Usa la Pala 🪓!", "bg-rose-600 text-white");
                return;
            }

            if (herramientaActual === 'regar') {
                p.agua = 100;
                p.salud = Math.min(100, p.salud + 15);
                guardarJuego();
                renderizarTodo();
                avisarEnPantalla("💧 ¡Muy bien! La planta ya tiene agua.", "exito");
                lanzarEfecto(index, "💧 ¡Regada!", "bg-blue-600 text-white");
            }
            else if (herramientaActual === 'abonar') {
                p.abono = 100;
                p.progreso = Math.min(100, p.progreso + 15);
                guardarJuego();
                renderizarTodo();
                avisarEnPantalla("🍂 ¡Excelente! El abono acelera el crecimiento.", "exito");
                lanzarEfecto(index, "🍂 ¡Abonada!", "bg-amber-600 text-white");
            }
            else if (herramientaActual === 'podar') {
                p.progreso = Math.min(100, p.progreso + 25);
                guardarJuego();
                renderizarTodo();
                avisarEnPantalla("✂️ ¡Podada con éxito!", "exito");
                lanzarEfecto(index, "✂️ ¡Podada!", "bg-purple-600 text-white");
            }
            else if (herramientaActual === 'cosechar') {
                if (p.progreso < 100) {
                    avisarEnPantalla("⏳ Todavía no está lista. Espera al 100%.", "info");
                    lanzarEfecto(index, "¡Aún le falta!", "bg-amber-500 text-amber-950");
                    return;
                }
                const info = catalogoPlantas.find(c => c.tipo === p.tipo);
                gameState.inventario[p.tipo] = (gameState.inventario[p.tipo] || 0) + 1;
                gameState.parcelas[index] = { id: p.id, tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0 };
                guardarJuego();
                renderizarTodo();
                avisarEnPantalla(`🧺 ¡Recogiste ${info.nombre}! Entrégala arriba en los pedidos.`, "exito");
                lanzarEfecto(index, `+1 ${info.icono} Recogida`, "bg-amber-400 text-amber-950");
            }
        }

        function entregarPedido(indexPedido) {
            const pedido = gameState.pedidos[indexPedido];
            const tienes = gameState.inventario[pedido.tipo] || 0;

            if (tienes < pedido.cantidad) {
                avisarEnPantalla(`⚠️ Faltan unidades. Tienes ${tienes} de ${pedido.cantidad} para este pedido.`, "error");
                return;
            }

            gameState.inventario[pedido.tipo] -= pedido.cantidad;
            gameState.money += pedido.recompensa;

            const nuevoTipo = catalogoPlantas[Math.floor(Math.random() * catalogoPlantas.length)];
            const clientesNombres = ["👴 Don Mateo", "👩 Doña Carmen", "🧑‍🦰 Lucas", "👩‍🦱 Elena", "👴 Abuelo José"];
            gameState.pedidos[indexPedido] = {
                id: Date.now(),
                cliente: clientesNombres[Math.floor(Math.random() * clientesNombres.length)],
                tipo: nuevoTipo.tipo,
                cantidad: Math.random() > 0.5 ? 2 : 1,
                recompensa: Math.round(nuevoTipo.venta * 1.8)
            };

            guardarJuego();
            renderizarTodo();
            avisarEnPantalla(`🎉 ¡Pedido entregado! Ganaste 🪙 ${pedido.recompensa} monedas.`, "exito");
        }

        function comprarParcela() {
            const costo = 60;
            if (gameState.money < costo) {
                avisarEnPantalla("⚠️ Necesitas 60 monedas para comprar más tierra.", "error");
                return;
            }
            gameState.money -= costo;
            gameState.parcelas.push({
                id: gameState.parcelas.length + 1, tipo: null, salud: 0, agua: 0, abono: 0, progreso: 0
            });
            guardarJuego();
            renderizarTodo();
            avisarEnPantalla("✨ ¡Desbloqueaste un nuevo cuadro de tierra!", "exito");
        }

        function renderizarPedidos() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            gameState.pedidos.forEach((ped, idx) => {
                const infoPlanta = catalogoPlantas.find(c => c.tipo === ped.tipo);
                const tienes = gameState.inventario[ped.tipo] || 0;
                const listo = tienes >= ped.cantidad;

                container.innerHTML += `
                    <div class="bg-amber-50 border-4 ${listo ? 'border-emerald-600' : 'border-amber-700'} rounded-2xl p-4 flex flex-col justify-between gap-3 shadow-md">
                        <div>
                            <p class="text-base font-black text-amber-900">${ped.cliente}</p>
                            <p class="text-xl font-black text-stone-900 mt-1">
                                Pide: ${ped.cantidad} ${infoPlanta.icono} ${infoPlanta.nombre}
                            </p>
                            <p class="text-sm text-stone-600 italic">(${infoPlanta.desc})</p>
                            <p class="text-base font-extrabold text-emerald-800 mt-1">
                                Tienes: ${tienes} de ${ped.cantidad}
                            </p>
                        </div>
                        <button onclick="entregarPedido(${idx})" class="w-full ${listo ? 'bg-emerald-500 hover:bg-emerald-400 text-emerald-950 cursor-pointer' : 'bg-stone-300 text-stone-600'} font-black text-lg py-2.5 rounded-xl border-2 border-stone-800 transition">
                            ${listo ? `✅ ENTREGAR (🪙 +${ped.recompensa})` : `Faltan flores (🪙 ${ped.recompensa})`}
                        </button>
                    </div>
                `;
            });
        }

        function renderizarSemillas() {
            const container = document.getElementById('seeds-toolbar');
            container.innerHTML = '';
            catalogoPlantas.forEach(planta => {
                const btnId = `btn-semilla-${planta.tipo}`;
                const esActiva = herramientaActual === `semilla:${planta.tipo}`;
                const enInventario = gameState.inventario[planta.tipo] || 0;

                container.innerHTML += `
                    <button onclick="seleccionarHerramienta('semilla:${planta.tipo}', '${planta.icono} ${planta.nombre.toUpperCase()}')" 
                            id="${btnId}" 
                            class="tool-btn ${esActiva ? 'ring-4 ring-amber-300 scale-105' : ''} bg-emerald-800 border-2 border-emerald-400 text-white px-4 py-2.5 rounded-2xl flex items-center gap-3 shrink-0 cursor-pointer">
                        <span class="text-3xl">${planta.icono}</span>
                        <div class="text-left">
                            <p class="text-base font-black leading-tight">${planta.nombre}</p>
                            <p class="text-xs font-bold text-amber-200">${planta.desc}</p>
                            <p class="text-sm font-black text-amber-300 mt-0.5">🪙 ${planta.costo} | Tienes: ${enInventario}</p>
                        </div>
                    </button>
                `;
            });
        }

        function renderizarHuerto() {
            document.getElementById('player-money').innerText = gameState.money;
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';

            gameState.parcelas.forEach((p, index) => {
                const estaHumeda = p.agua > 40;
                const claseTierra = estaHumeda ? 'parcela-tierra parcela-humeda' : 'parcela-tierra';

                if (!p.tipo) {
                    grid.innerHTML += `
                        <div id="parcela-${index}" onclick="interactuarParcela(${index})" 
                             class="${claseTierra} rounded-3xl h-64 border-4 border-amber-950 flex flex-col items-center justify-center cursor-pointer p-4 text-center relative">
                            <span class="text-5xl opacity-50 mb-2">🕳️</span>
                            <span class="text-xl font-black text-amber-100 bg-black/50 px-4 py-1.5 rounded-xl">Tierra Vacía</span>
                        </div>
                    `;
                } else {
                    const info = catalogoPlantas.find(c => c.tipo === p.tipo);
                    const madura = p.progreso >= 100;
                    const muerta = p.salud <= 0;

                    let visualPlanta = info.brote;
                    let tamanoVisual = "text-6xl";

                    if (muerta) {
                        visualPlanta = "🥀";
                        tamanoVisual = "text-7xl";
                    } else if (p.progreso >= 100) {
                        visualPlanta = info.icono;
                        tamanoVisual = "text-8xl drop-shadow-xl";
                    } else if (p.progreso >= 50) {
                        visualPlanta = info.media;
                        tamanoVisual = "text-7xl";
                    }

                    let estadoTexto = "";
                    if (muerta) {
                        estadoTexto = `<span class="bg-rose-600 text-white text-base font-black px-3 py-1 rounded-xl border-2 border-white">❌ MARCHITA</span>`;
                    } else if (madura) {
                        estadoTexto = `<span class="bg-amber-400 text-amber-950 text-base font-black px-3 py-1 rounded-xl border-2 border-amber-950 animate-bounce">🧺 ¡LISTA!</span>`;
                    } else if (p.agua < 35) {
                        estadoTexto = `<span class="bg-blue-600 text-white text-base font-black px-3 py-1 rounded-xl border-2 border-white">💧 PIDE AGUA</span>`;
                    } else {
                        estadoTexto = `<span class="bg-emerald-700 text-white text-sm font-black px-3 py-1 rounded-xl">CRECIENDO</span>`;
                    }

                    grid.innerHTML += `
                        <div id="parcela-${index}" onclick="interactuarParcela(${index})" 
                             class="${claseTierra} rounded-3xl h-64 border-4 ${madura ? 'border-amber-300' : 'border-amber-950'} flex flex-col items-center justify-between p-4 cursor-pointer relative">
                            
                            <div class="w-full flex justify-between items-center">
                                <span class="text-lg font-black text-white bg-black/60 px-3 py-0.5 rounded-xl">${info.nombre}</span>
                                ${estadoTexto}
                            </div>

                            <div class="flex-1 flex items-center justify-center my-1">
                                <span class="${tamanoVisual} ${muerta ? '' : 'planta-viva'} select-none">
                                    ${visualPlanta}
                                </span>
                            </div>

                            <div class="w-full bg-black/75 rounded-2xl p-2.5 space-y-2">
                                <div class="flex justify-between text-base font-black text-white px-1">
                                    <span>🌱 Crecimiento:</span>
                                    <span class="text-emerald-300">${Math.round(p.progreso)}%</span>
                                </div>
                                <div class="w-full bg-stone-700 h-3 rounded-full overflow-hidden">
                                    <div class="bg-emerald-400 h-3 transition-all duration-300" style="width: ${p.progreso}%"></div>
                                </div>
                                <div class="flex justify-between text-sm font-black text-sky-200 px-1">
                                    <span>💧 Agua: ${Math.round(p.agua)}%</span>
                                    <span>❤️ Salud: ${Math.round(p.salud)}%</span>
                                </div>
                            </div>

                        </div>
                    `;
                }
            });
        }

        function renderizarTodo() {
            renderizarPedidos();
            renderizarSemillas();
            renderizarHuerto();
        }

        setInterval(() => {
            actualizarClima();
            const climaObj = climas.find(c => c.id === gameState.clima) || climas[0];
            let huboCambios = false;

            gameState.parcelas.forEach(p => {
                if (p.tipo && p.salud > 0 && p.progreso < 100) {
                    p.agua = Math.min(100, Math.max(0, p.agua - climaObj.efectoAgua));
                    p.abono = Math.max(0, p.abono - 0.5);

                    if (p.agua <= 10 || p.abono <= 5) {
                        p.salud = Math.max(0, p.salud - 2);
                    }
                    if (p.salud > 20 && p.agua > 10) {
                        p.progreso = Math.min(100, p.progreso + 3);
                    }
                    huboCambios = true;
                }
            });

            if (huboCambios) {
                guardarJuego();
                renderizarHuerto();
            }
        }, 5000);

        cargarJuego();
        renderizarTodo();
    </script>
</body>
</html>
