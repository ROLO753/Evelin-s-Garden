<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌻 Evelin's Garden - Huerto Vivo y Mágico</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes latido {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .planta-viva {
            animation: latido 2s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes flotarMariposa {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(100px, -30px) rotate(10deg); }
            66% { transform: translate(-80px, -15px) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .mariposa-dorada {
            animation: flotarMariposa 6s ease-in-out infinite;
            cursor: pointer;
            filter: drop-shadow(0 0 8px gold);
        }

        @keyframes saltarPremio {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-90px) scale(1.6); opacity: 0; }
        }
        .premio-flotante {
            animation: saltarPremio 1.2s ease-out forwards;
            pointer-events: none;
        }

        .parcela-tierra {
            background-color: #78350f;
            background-image: radial-gradient(#92400e 15%, transparent 16%),
                              radial-gradient(#451a03 15%, transparent 16%);
            background-size: 28px 28px;
            background-position: 0 0, 14px 14px;
            box-shadow: inset 0 8px 14px rgba(0,0,0,0.6), 0 6px 0 #451a03;
        }

        .parcela-humeda {
            background-color: #451a03;
            background-image: radial-gradient(#78350f 15%, transparent 16%),
                              radial-gradient(#290f02 15%, transparent 16%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden select-none font-sans bg-sky-300 text-lg">

    <!-- CABECERA -->
    <div class="relative bg-gradient-to-b from-sky-400 via-sky-300 to-emerald-200 pt-5 pb-8 px-4 border-b-8 border-amber-900 overflow-hidden">
        
        <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4 bg-amber-50 border-4 border-amber-800 rounded-3xl px-6 py-4 shadow-xl mb-6 relative z-20">
            <div class="flex items-center gap-4 text-center md:text-left">
                <span class="text-5xl animate-bounce">🌻</span>
                <div>
                    <h1 class="text-3xl sm:text-4xl font-black text-amber-950 tracking-tight">
                        EVELIN'S GARDEN: HUERTO MÁGICO
                    </h1>
                    <p class="text-base sm:text-lg font-bold text-emerald-800">¡Todo pasa aquí mismo! Toca las plantas para regarlas y cumple pedidos.</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="bg-amber-200 border-3 border-amber-600 px-5 py-2.5 rounded-2xl flex items-center gap-3 shadow-inner">
                    <span class="text-4xl">🪙</span>
                    <div>
                        <p class="text-xs font-black uppercase text-amber-900">MONEDAS</p>
                        <p id="player-money" class="text-3xl font-black text-amber-950">250</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- CARTEL DE AVISOS -->
        <div id="visual-banner" class="max-w-6xl mx-auto mb-5 bg-amber-100 border-4 border-amber-600 rounded-2xl px-6 py-4 text-center shadow-lg transition-all relative z-20">
            <p id="visual-banner-text" class="text-xl sm:text-2xl font-black text-amber-950">
                ✨ ¡Atrapa las mariposas doradas y abre los cofres sorpresa que aparecen en el huerto!
            </p>
        </div>

        <!-- TABLÓN DE PEDIDOS -->
        <section class="max-w-6xl mx-auto bg-amber-900 border-4 border-amber-950 rounded-3xl p-5 shadow-2xl relative z-20">
            <h2 class="text-amber-100 font-black text-xl uppercase mb-4 flex items-center gap-2">
                📜 Pedidos Urgentes de la Aldea
            </h2>
            <div id="orders-container" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
        </section>
    </div>

    <!-- HUERTO PRINCIPAL (TODO OCURRE AQUÍ) -->
    <main class="flex-1 py-8 px-4 relative" style="background: linear-gradient(180deg, #4ade80 0%, #22c55e 40%, #15803d 100%);">
        
        <div class="max-w-6xl mx-auto mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 bg-amber-950 border-4 border-amber-600 px-6 py-4 rounded-2xl shadow-xl text-white">
            <div class="text-lg sm:text-2xl font-black flex items-center gap-3 flex-wrap justify-center">
                <span>ESTADO:</span>
                <span class="bg-amber-400 text-amber-950 px-4 py-1 rounded-xl text-xl sm:text-2xl font-black">✨ HUERTO ACTIVO Y VIVO</span>
            </div>
            <button onclick="comprarParcela()" class="bg-emerald-400 hover:bg-emerald-300 text-emerald-950 font-black text-base sm:text-lg px-5 py-3 rounded-2xl border-3 border-emerald-800 shadow-lg cursor-pointer">
                ➕ AMPLIAR TERRENO (🪙 80)
            </button>
        </div>

        <!-- Cuadrícula del Huerto -->
        <div id="farm-grid" class="max-w-6xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pb-24"></div>
    </main>

    <!-- BARRA INFERIOR DE SEMILLAS Y PLANTAS -->
    <footer class="fixed bottom-0 left-0 right-0 z-30 bg-amber-950 border-t-4 border-amber-500 px-3 py-3 shadow-2xl">
        <div class="max-w-6xl mx-auto flex flex-col gap-3">
            <div id="seeds-toolbar" class="flex items-center gap-2 sm:gap-3 overflow-x-auto justify-start sm:justify-center pb-1"></div>
        </div>
    </footer>

    <script>
        const catalogoPlantas = [
            { tipo: "Margarita", nombre: "Margarita", icono: "🌼", costo: 15, venta: 50, desc: "Alegre y rápida." },
            { tipo: "Girasol", nombre: "Girasol", icono: "🌻", costo: 35, venta: 110, desc: "Gran valor solar." },
            { tipo: "Manzanilla", nombre: "Manzanilla", icono: "🌼", costo: 25, venta: 80, desc: "Té relajante." },
            { tipo: "Lavanda", nombre: "Lavanda", icono: "🪻", costo: 60, venta: 180, desc: "Aromática y elegante." },
            { tipo: "Menta", nombre: "Menta", icono: "🌿", costo: 30, venta: 90, desc: "Té fresco." }
        ];

        let gameState = {
            money: 250,
            inventario: { Margarita: 0, Girasol: 0, Manzanilla: 0, Lavanda: 0, Menta: 0 },
            pedidos: [
                { id: 1, cliente: "👴 Don Mateo", tipo: "Margarita", cantidad: 2, recompensa: 140 },
                { id: 2, cliente: "👩‍🌾 Doña Rosa", tipo: "Manzanilla", cantidad: 1, recompensa: 160 }
            ],
            parcelas: [
                { id: 1, tipo: "Margarita", progreso: 40, evento: null }, // null, 'mariposa', 'cofre'
                { id: 2, tipo: "Girasol", progreso: 100, evento: null },
                { id: 3, tipo: null, progreso: 0, evento: 'cofre' } // Empieza con cofre sorpresa
            ]
        };

        function avisar(msg, tipo = "info") {
            const banner = document.getElementById('visual-banner');
            const texto = document.getElementById('visual-banner-text');
            texto.innerText = msg;
            if(tipo === "exito") banner.className = "max-w-6xl mx-auto mb-5 bg-emerald-100 border-4 border-emerald-600 rounded-2xl px-6 py-4 text-center shadow-lg transition-all";
            else if(tipo === "alerta") banner.className = "max-w-6xl mx-auto mb-5 bg-rose-100 border-4 border-rose-600 rounded-2xl px-6 py-4 text-center shadow-lg transition-all";
            else banner.className = "max-w-6xl mx-auto mb-5 bg-amber-100 border-4 border-amber-600 rounded-2xl px-6 py-4 text-center shadow-lg transition-all";
        }

        function lanzarPremioVisual(index, texto) {
            const parcela = document.getElementById(`parcela-${index}`);
            if(!parcela) return;
            const premio = document.createElement('div');
            premio.className = "absolute text-3xl font-black text-amber-300 premio-flotante z-30 top-1/2 left-1/2";
            premio.innerText = texto;
            parcela.appendChild(premio);
            setTimeout(() => premio.remove(), 1200);
        }

        function interactuarParcela(index) {
            const p = gameState.parcelas[index];

            // 1. Si hay un cofre sorpresa enterrado, abrirlo al tocarlo
            if (p.evento === 'cofre') {
                p.evento = null;
                const premioMonedas = 60;
                gameState.money += premioMonedas;
                lanzarPremioVisual(index, `🎁 +🪙 ${premioMonedas}`);
                renderizarTodo();
                avisar("🎁 ¡Encontraste un cofre sorpresa enterrado con monedas extra!", "exito");
                return;
            }

            // 2. Si hay una mariposa dorada posada, atraparla al tocarla
            if (p.evento === 'mariposa') {
                p.evento = null;
                const premioMonedas = 40;
                gameState.money += premioMonedas;
                lanzarPremioVisual(index, `🦋 +🪙 ${premioMonedas}`);
                renderizarTodo();
                avisar("🦋 ¡Atrapaste la mariposa dorada y te regaló monedas!", "exito");
                return;
            }

            // 3. Si la tierra está vacía, sembrar automáticamente la primera semilla
            if (p.tipo === null) {
                const info = catalogoPlantas[0];
                if (gameState.money < info.costo) {
                    avisar("⚠️ No tienes suficientes monedas para sembrar.", "alerta");
                    return;
                }
                gameState.money -= info.costo;
                p.tipo = info.tipo;
                p.progreso = 15;
                renderizarTodo();
                avisar(`🌱 ¡Sembraste ${info.nombre}! Toca la planta para regarla y hacerla crecer.`, "exito");
                return;
            }

            // 4. Si ya está madura, cosechar al instante
            if (p.progreso >= 100) {
                const info = catalogoPlantas.find(c => c.tipo === p.tipo);
                gameState.inventario[p.tipo] = (gameState.inventario[p.tipo] || 0) + 1;
                lanzarPremioVisual(index, `🧺 +1 ${info.icono}`);
                gameState.parcelas[index] = { id: p.id, tipo: null, progreso: 0, evento: null };
                renderizarTodo();
                avisar(`🎉 ¡Cosechaste ${info.nombre} con éxito! Ya está en tu inventario.`, "exito");
                return;
            }

            // 5. Si está creciendo, tocarla funciona como RIEGO DIRECTO (Avanza un 35% de golpe con estrellitas)
            p.progreso = Math.min(100, p.progreso + 35);
            lanzarPremioVisual(index, "💧 ✨");
            renderizarTodo();
            avisar("💧 ¡Regaste la planta! Dio un gran salto de crecimiento.", "exito");
        }

        function entregarPedido(idx) {
            const pedido = gameState.pedidos[idx];
            const tienes = gameState.inventario[pedido.tipo] || 0;

            if (tienes < pedido.cantidad) {
                avisar(`⚠️ Te faltan unidades. Tienes ${tienes} y te piden ${pedido.cantidad}.`, "alerta");
                return;
            }

            gameState.inventario[pedido.tipo] -= pedido.cantidad;
            gameState.money += pedido.recompensa;

            const randomPlanta = catalogoPlantas[Math.floor(Math.random() * catalogoPlantas.length)];
            const vecinos = ["👴 Don Mateo", "👩 Doña Rosa", "👧 Sofía", "🧑‍🦰 Lucas"];
            gameState.pedidos[idx] = {
                id: Date.now(),
                cliente: vecinos[Math.floor(Math.random() * vecinos.length)],
                tipo: randomPlanta.tipo,
                cantidad: 1,
                recompensa: randomPlanta.venta * 2
            };

            renderizarTodo();
            avisar(`🎉 ¡Pedido entregado con éxito! ¡Ganaste 🪙 ${pedido.recompensa} monedas!`, "exito");
        }

        function comprarParcela() {
            const costo = 80;
            if (gameState.money < costo) {
                avisar("⚠️ Te faltan monedas para ampliar el terreno.", "alerta");
                return;
            }
            gameState.money -= costo;
            gameState.parcelas.push({ id: gameState.parcelas.length + 1, tipo: null, progreso: 0, evento: 'cofre' });
            renderizarTodo();
            avisar("✨ ¡Terreno ampliado con un cofre sorpresa de regalo!", "exito");
        }

        function renderizarPedidos() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            gameState.pedidos.forEach((ped, idx) => {
                const info = catalogoPlantas.find(c => c.tipo === ped.tipo);
                const tienes = gameState.inventario[ped.tipo] || 0;
                const listo = tienes >= ped.cantidad;

                container.innerHTML += `
                    <div class="bg-amber-50 border-4 ${listo ? 'border-emerald-600' : 'border-amber-700'} rounded-2xl p-4 flex flex-col justify-between gap-3 shadow-md">
                        <div>
                            <p class="text-base font-black text-amber-900">${ped.cliente}</p>
                            <p class="text-xl font-black text-stone-900 mt-1">Pide: ${ped.cantidad} ${info.icono} ${info.nombre}</p>
                            <p class="text-base font-extrabold text-emerald-800 mt-1">En inventario: ${tienes}</p>
                        </div>
                        <button onclick="entregarPedido(${idx})" class="w-full ${listo ? 'bg-emerald-500 hover:bg-emerald-400 text-emerald-950 cursor-pointer animate-pulse' : 'bg-stone-300 text-stone-600'} font-black text-lg py-2.5 rounded-xl border-2 border-stone-800 transition">
                            ${listo ? `✅ ENTREGAR YA (+🪙 ${ped.recompensa})` : `Faltan flores`}
                        </button>
                    </div>
                `;
            });
        }

        function renderizarSemillas() {
            const container = document.getElementById('seeds-toolbar');
            container.innerHTML = '';
            catalogoPlantas.forEach(planta => {
                const tienes = gameState.inventario[planta.tipo] || 0;
                container.innerHTML += `
                    <div class="bg-emerald-800 border-2 border-emerald-400 text-white px-4 py-2.5 rounded-2xl flex items-center gap-3 shrink-0 shadow">
                        <span class="text-3xl">${planta.icono}</span>
                        <div class="text-left">
                            <p class="text-base font-black leading-tight">${planta.nombre} (🪙 ${planta.costo})</p>
                            <p class="text-sm font-black text-amber-300">Almacenadas: ${tienes}</p>
                        </div>
                    </div>
                `;
            });
        }

        function renderizarHuerto() {
            document.getElementById('player-money').innerText = gameState.money;
            const grid = document.getElementById('farm-grid');
            grid.innerHTML = '';

            gameState.parcelas.forEach((p, index) => {
                let badgeEvento = "";
                if (p.evento === 'cofre') {
                    badgeEvento = `<span class="absolute top-2 right-2 bg-amber-400 text-amber-950 text-sm font-black px-3 py-1 rounded-xl border-2 border-amber-950 animate-bounce z-20">🎁 ¡COFRE SORPRESA!</span>`;
                } else if (p.evento === 'mariposa') {
                    badgeEvento = `<span class="absolute top-2 right-2 bg-yellow-300 text-yellow-950 text-sm font-black px-3 py-1 rounded-xl border-2 border-yellow-600 mariposa-dorada z-20">🦋 ¡MARIPOSA DORADA!</span>`;
                }

                if (!p.tipo && p.evento !== 'cofre') {
                    grid.innerHTML += `
                        <div id="parcela-${index}" onclick="interactuarParcela(${index})" 
                             class="parcela-tierra rounded-3xl h-64 border-4 border-amber-950 flex flex-col items-center justify-center cursor-pointer p-4 text-center relative shadow-xl hover:brightness-110 transition">
                            <span class="text-5xl opacity-50 mb-2">🕳️</span>
                            <span class="text-xl font-black text-amber-100 bg-black/50 px-4 py-1.5 rounded-xl">Tierra Fértil (Toca para Sembrar)</span>
                        </div>
                    `;
                } else {
                    const info = p.tipo ? catalogoPlantas.find(c => c.tipo === p.tipo) : { nombre: "Cofre Mágico", icono: "📦", brote: "🎁" };
                    const madura = p.progreso >= 100;
                    const visualPlanta = p.evento === 'cofre' ? "🎁" : (madura ? info.icono : info.brote);
                    const tamanoVisual = p.evento === 'cofre' ? "text-7xl animate-bounce" : (madura ? "text-8xl drop-shadow-xl" : "text-6xl");

                    let estadoTexto = p.evento === 'cofre' 
                        ? `<span class="bg-amber-400 text-amber-950 text-base font-black px-3 py-1 rounded-xl border-2 border-amber-950 animate-bounce">🎁 ¡TOCA PARA ABRIR!</span>`
                        : (madura 
                            ? `<span class="bg-amber-400 text-amber-950 text-base font-black px-3 py-1 rounded-xl border-2 border-amber-950 animate-bounce">🧺 ¡TOCA PARA COSECHAR!</span>`
                            : `<span class="bg-emerald-700 text-white text-sm font-black px-3 py-1 rounded-xl animate-pulse">💧 ¡Toca para regar y crecer!</span>`);

                    grid.innerHTML += `
                        <div id="parcela-${index}" onclick="interactuarParcela(${index})" 
                             class="parcela-tierra parcela-humeda rounded-3xl h-64 border-4 ${madura ? 'border-amber-300' : 'border-amber-950'} flex flex-col items-center justify-between p-4 cursor-pointer relative shadow-xl hover:brightness-110 transition">
                            
                            ${badgeEvento}

                            <div class="w-full flex justify-between items-center">
                                <span class="text-lg font-black text-white bg-black/60 px-3 py-0.5 rounded-xl">${p.evento === 'cofre' ? 'Cofre Sorpresa' : info.nombre}</span>
                                ${estadoTexto}
                            </div>

                            <div class="flex-1 flex items-center justify-center my-1">
                                <span class="${tamanoVisual} ${madura && p.evento !== 'cofre' ? 'planta-viva' : ''} select-none">
                                    ${visualPlanta}
                                </span>
                            </div>

                            ${p.evento === 'cofre' ? '<div class="w-full text-center text-amber-200 font-black text-sm pb-2">¡Premio oculto en el terreno!</div>' : `
                            <div class="w-full bg-black/75 rounded-2xl p-2.5 space-y-2">
                                <div class="flex justify-between text-base font-black text-white px-1">
                                    <span>🌱 Crecimiento:</span>
                                    <span class="text-emerald-300">${Math.round(p.progreso)}%</span>
                                </div>
                                <div class="w-full bg-stone-700 h-3 rounded-full overflow-hidden">
                                    <div class="bg-emerald-400 h-3 transition-all duration-300" style="width: ${p.progreso}%"></div>
                                </div>
                            </div>`}
                        </div>
                    `;
                }
            });
        }

        function renderizarTodo() {
            renderizarPedidos();
            renderizarSemillas();
            renderizarHuerto();
        }

        // Evento espontáneo directo en la pantalla: Cada 15 segundos aparece una mariposa dorada o un cofre en alguna parcela
        setInterval(() => {
            const parcelasDisponibles = gameState.parcelas.filter(p => !p.evento);
            if (parcelasDisponibles.length > 0 && Math.random() > 0.3) {
                const aleatoria = parcelasDisponibles[Math.floor(Math.random() * parcelasDisponibles.length)];
                aleatoria.evento = Math.random() > 0.5 ? 'mariposa' : 'cofre';
                renderizarHuerto();
                avisar("✨ ¡Sorpresa en el huerto! Revisa las parcelas, apareció algo brillante.", "exito");
            }
        }, 15000);

        renderizarTodo();
    </script>
</body>
</html>
